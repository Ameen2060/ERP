async function openEInvoice(id){
  let d; try{ d=await api('/einvoicing/'+id); }catch(e){ toast(e.message); return; }
  const p=d.payload||{}, v=d.validation||{errors:[],warnings:[]};
  const errs=(v.errors||[]).map(e=>`<li><b>${esc(e.field)}</b> — ${esc(e.message)}${e.hint?` <span class="muted">(${esc(e.hint)})</span>`:''}</li>`).join('');
  const warns=(v.warnings||[]).map(w=>`<li>${esc(w.field||'')} — ${esc(w.message)}</li>`).join('');
  const valBox=(v.errors&&v.errors.length)
    ? `<div class="banner b-err"><b>System validation failed — ${v.errors.length} issue(s):</b><ul style="margin:6px 0 0 18px">${errs}</ul></div>`
    : `<div class="banner b-ok">System validation passed. ${warns?'See advisories below.':''}</div>`;
  const warnBox=warns?`<div class="banner b-warn" style="margin-top:6px"><b>Advisories:</b><ul style="margin:6px 0 0 18px">${warns}</ul></div>`:'';
  const lines=(p.lines||[]).map(l=>`<tr><td>${esc(l.description||'')}</td><td class="num">${l.quantity}</td><td class="num">${money(l.unit_price)}</td><td class="num">${money(l.discount||0)}</td><td class="num">${money(l.net_amount)}</td><td>${esc(l.vat_category||'')} ${(Number(l.vat_rate)*100).toFixed(0)}%</td><td class="num">${money(l.vat_amount)}</td><td class="num">${money(l.line_total)}</td></tr>`).join('');
  const refs=p.references||{}; const ref=refs.original_invoice||refs.original_bill;
  const ev=(d.events||[]).map(e=>`<tr><td>${e.at?e.at.slice(0,19).replace('T',' '):''}</td><td>${esc(e.action)}</td><td>${esc(e.from_status||'')}→${esc(e.to_status||'')}</td><td class="muted" style="font-size:12px">${esc(e.detail||'')}</td></tr>`).join('');
  const acts=[];
  if(d.allowed_actions.includes('revalidate')) acts.push(`<button class="btn" onclick="einvAct('${id}','validate')">Re-validate</button>`);
  if(d.allowed_actions.includes('submit')) acts.push(`<button class="btn-primary" onclick="einvAct('${id}','submit')">Submit</button>`);
  if(d.allowed_actions.includes('resubmit')) acts.push(`<button class="btn" onclick="einvAct('${id}','resubmit')">Resubmit</button>`);
  if(d.allowed_actions.includes('cancel')) acts.push(`<button class="btn" onclick="einvAct('${id}','cancel')">Cancel</button>`);
  // Simulated inbound provider response (until a real ASP is connected).
  acts.push(`<button class="btn" onclick="einvStatusForm('${id}')">Record provider response</button>`);
  modal(`<div class="row"><div><div class="muted">${esc(d.source_label)} · ${esc(d.direction)}</div><h1 style="margin:0">E-Invoice ${esc(d.doc_number||'')}</h1></div>
      <button class="x" onclick="closeModal()">✕</button></div>
    <div style="margin:8px 0">${einvComplianceBadges(d)} <span class="pill ${EINV_PILL[d.status]||'p-draft'}">${esc(d.status_label)}</span>${(d.response&&d.response.simulated)?' <span class="pill p-void" title="Sandbox simulation — not a real ASP/FTA response">SIMULATED (sandbox)</span>':''}</div>
    ${d.provisional?`<div class="muted" style="font-size:12px;margin-bottom:8px">⚠ ${esc(d.compliance.provisional_notice||'')}</div>`:''}
    ${valBox}${warnBox}
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
      <div>${card(`<b>Party</b><br>${esc(d.party_name||'—')}<br>TRN: ${esc(d.party_trn||'—')}${d.party_class?` · ${d.party_class}`:''}`)}</div>
      <div>${card(`<b>Document</b><br>No: ${esc(d.doc_number||'—')}<br>Date: ${esc(p.invoice&&p.invoice.issue_date||'—')} · ${esc(d.currency)}${ref?`<br>Original: ${esc(ref)}`:''}<br>Schema: ${esc(d.schema_id||'—')} ${esc(d.schema_version||'')}`)}</div>
    </div>
    ${card(`<div class="scroll"><table><thead><tr><th>Description</th><th>Qty</th><th>Unit</th><th>Disc</th><th>Net</th><th>VAT</th><th>VAT amt</th><th>Total</th></tr></thead><tbody>${lines||'<tr><td colspan="8" class="muted">No lines.</td></tr>'}</tbody><tfoot><tr><th colspan="4">Totals</th><th class="num">${money(d.net_total)}</th><th></th><th class="num">${money(d.vat_total)}</th><th class="num">${money(d.grand_total)}</th></tr></tfoot></table></div>`)}
    <div class="row mt" style="flex-wrap:wrap;gap:6px">${acts.join(' ')} ${docBtns('einvoice',id,'/api/einvoicing/'+id+'/pdf')}</div>
    <h3 class="mt">Audit trail</h3>${card(`<div class="scroll"><table><thead><tr><th>When</th><th>Action</th><th>Status</th><th>Detail</th></tr></thead><tbody>${ev||'<tr><td colspan="4" class="muted">—</td></tr>'}</tbody></table></div>`)}
    `,'max-width:960px');
}

const CT_STATUS = {
  draft:        {label:'Draft',                    cls:'b-warn',  color:'var(--muted)'},

  sme_reviewed: {label:'SME reviewed — to validate', cls:'b-warn', color:'#2563eb'},
  validated:    {label:'Validated — filing-ready',  cls:'b-ok',    color:'var(--ok,#1a7f37)'},
  rejected:     {label:'Rejected — rework',         cls:'b-err',   color:'var(--danger,#b91c1c)'},
};
function ctPill(s){ const m=CT_STATUS[s]||{label:s,color:'var(--muted)'}; return `<span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid ${m.color};color:${m.color}">${esc(m.label)}</span>`; }

  C.innerHTML=`<div class="row mb"><div><h1>Corporate Tax — Review &amp; Validation</h1>

async function openCtReview(id){
  try{
    const d=await api('/ct/reviews/'+id);
    current='ctReviews'; buildNav();
    $('#crumb').innerHTML=`<span style="cursor:pointer;color:var(--brand)" onclick="location.hash='reportCenter'">Report Center</span> › <span style="cursor:pointer;color:var(--brand)" onclick="location.hash='ctReviews'">CT Review &amp; Validation</span> › ${d.period_start||'—'} → ${d.period_end||'—'}`;
    const can=(a)=>d.allowed_actions.includes(a);
    const canSign=d.status==='provisional'||d.status==='sme_reviewed';
    const block=d.can_file
      ? `<div class="banner b-ok mb"><b>✓ VALIDATED — FILING-READY.</b> Validated by ${esc(d.sme_name||'—')} (${esc(d.validated_by||'')}) on ${d.validated_at?d.validated_at.slice(0,10):'—'}.${d.sme_note?' Note: '+esc(d.sme_note):''}</div>`
      : `<div class="banner b-err mb"><b>PROVISIONAL — REQUIRES SME VALIDATION.</b> This computation is NOT filing-ready. Every line must be signed off, then a qualified tax specialist must validate it.</div>`;
    // workflow buttons
    const btns=[];
    if(can('submit')) btns.push(`<button class="btn-primary" onclick="ctAct('${id}','submit')">Submit for SME review</button>`);
    if(can('mark_reviewed')) btns.push(`<button class="btn-primary" onclick="ctAct('${id}','mark-reviewed')">Mark SME-reviewed</button>`);
    if(can('validate')) btns.push(`<button class="btn-primary" onclick="ctValidate('${id}')">Validate (SME sign-off)</button>`);
    if(can('reject')) btns.push(`<button class="btn" onclick="ctReject('${id}')">Reject</button>`);
    if(can('reopen')) btns.push(`<button class="btn" onclick="ctAct('${id}','reopen','Reopening returns the review to Draft and clears all sign-offs and any validation. Continue?')">Reopen</button>`);
    // computation ladder with per-line sign-off
    const items=d.items.map(it=>{
      const strong=it.line_key; // ordinal-based; styling by amount kind unknown here → use bold on totals via label heuristics
      const sign=it.requires_signoff
        ? `<label style="display:inline-flex;align-items:center;gap:6px;cursor:${canSign?'pointer':'default'}">
             <input type="checkbox" ${it.signed_off?'checked':''} ${canSign?'':'disabled'} onchange="ctSignoff('${id}','${it.id}',this.checked)">
             <span style="font-size:11px" class="muted">${it.signed_off?('✓ '+esc(it.signed_by||'')):'sign off'}</span></label>`
        : `<span class="muted" style="font-size:11px">—</span>`;
      return `<tr><td>${esc(it.line_label)}</td><td class="num">${money(it.amount)}</td><td>${sign}</td></tr>`;
    }).join('');
    const prog=`${d.signed_count}/${d.signoff_total} lines signed off`;
    // exports (token-wrapped; final only when validated)
    const ex=`<div class="flex" style="gap:6px">
      <a class="btn" target="_blank" href="${withTok('/api/ct/reviews/'+id+'/export?format=pdf')}">Provisional PDF</a>
      <a class="btn" target="_blank" href="${withTok('/api/ct/reviews/'+id+'/export?format=xlsx')}">Provisional Excel</a>
      ${d.can_file?`<a class="btn btn-primary" target="_blank" href="${withTok('/api/ct/reviews/'+id+'/export?format=pdf&final=true')}">Final PDF (validated)</a>
        <a class="btn btn-primary" target="_blank" href="${withTok('/api/ct/reviews/'+id+'/export?format=xlsx&final=true')}">Final Excel</a>`
        :`<span class="btn" style="opacity:.5;cursor:not-allowed" title="Blocked until validated">Final export (blocked)</span>`}</div>`;
    // audit trail
    const ev=d.events.slice().reverse().map(e=>`<tr><td class="muted" style="white-space:nowrap">${e.at?e.at.slice(0,19).replace('T',' '):''}</td>
      <td>${esc(e.actor)}</td><td><b>${esc(e.action)}</b>${e.from_status?` <span class="muted">(${esc(e.from_status)}→${esc(e.to_status||'')})</span>`:''}</td><td>${esc(e.note||'')}</td></tr>`).join('');
    const comp=d.computation;
    const rec=`<div class="banner ${comp.reconciled?'b-ok':'b-err'} mb">${comp.reconciled?'✓ Accounting profit ties to P&amp;L net profit ('+money(comp.pl_net_profit)+')':'✗ Does not tie to P&L'}</div>`;

    C.innerHTML=`<div class="row mb"><div><div class="muted">Corporate Tax review</div>
        <h1 style="margin:0">${d.period_start||'—'} → ${d.period_end||'—'} ${ctPill(d.status)}</h1>
        <div class="muted">Prepared by ${esc(d.prepared_by||'—')} · ${esc(prog)}</div></div>
      <button class="btn" onclick="location.hash='ctReviews'">← Back to reviews</button></div>
      ${block}
      <div class="flex mb" style="flex-wrap:wrap;gap:8px">${btns.join('')||'<span class="muted">No actions available in this state.</span>'}</div>
      ${rec}
      <div class="grid" style="grid-template-columns:1.3fr .9fr;gap:16px;align-items:start">
        <div>${card(`<div class="pad"><div class="row"><b>Computation (snapshot)</b><span class="muted" style="font-size:12px">${esc(prog)}</span></div>
          <table class="mt"><thead><tr><th>Line</th><th class="num">Amount (AED)</th><th>SME sign-off</th></tr></thead><tbody>${items}</tbody></table></div>`)}
          <div class="mt">${ex}</div>
          <ul class="muted mt" style="font-size:12px;line-height:1.5">${comp.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
        </div>
        <div>${card(`<div class="pad"><b>Audit trail</b>
          <div class="scroll mt" style="max-height:60vh"><table><thead><tr><th>When (UTC)</th><th>Actor</th><th>Action</th><th>Note</th></tr></thead>
          <tbody>${ev||'<tr><td colspan="4" class="muted">No events.</td></tr>'}</tbody></table></div></div>`)}</div>
      </div>`;
  }catch(e){ toast(e.message); }
}

// ── Transaction document attachments ──────────────────────────────────────────
const ATT_STATUS={none:['⚪','No document'],attached:['🟢','Attached'],pending:['🟡','Pending review'],reviewed:['🔵','Reviewed'],mismatch:['🔴','Mismatch']};
function attFileBadge(a){ if(a.match_status==='mismatch')return['🔴','Mismatch']; if(a.review_status==='reviewed')return['🔵','Reviewed']; return['🟡','Pending']; }
function fmtBytes(n){ n=Number(n||0); if(n<1024)return n+' B'; if(n<1048576)return (n/1024).toFixed(0)+' KB'; return (n/1048576).toFixed(1)+' MB'; }
let _attCtx={entityType:null,entityId:null,mountId:'attMount'};

function mountAttachments(entityType, entityId, mountId='attMount'){
  _attCtx={entityType,entityId,mountId};
  const el=document.getElementById(mountId); if(!el) return;
  el.innerHTML=`<div style="border-top:1px solid var(--border);margin-top:14px;padding-top:12px">
    <div class="row"><b>Attachments <span id="att_badge" class="muted" style="font-weight:400"></span></b>
      <span><input type="file" id="att_file" multiple style="display:none"><button class="btn" id="att_btn">＋ Upload document</button></span></div>
    <div id="att_drop" style="margin-top:8px;padding:14px;border:1.5px dashed var(--border);border-radius:8px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer">
      Drag &amp; drop files here, or click to upload · PDF, JPG, PNG, Excel, CSV, Word</div>
    <div id="att_list" class="mt"></div></div>`;
  const drop=el.querySelector('#att_drop'), fileIn=el.querySelector('#att_file');
  el.querySelector('#att_btn').onclick=()=>fileIn.click();
  drop.onclick=()=>fileIn.click();
  fileIn.onchange=(e)=>attUploadFiles(e.target.files);
  drop.ondragover=(e)=>{e.preventDefault();drop.style.background='var(--elevated)';drop.style.borderColor='var(--brand)';};
  drop.ondragleave=()=>{drop.style.background='';drop.style.borderColor='var(--border)';};
  drop.ondrop=(e)=>{e.preventDefault();drop.style.background='';drop.style.borderColor='var(--border)';attUploadFiles(e.dataTransfer.files);};
  attRefresh();
}
async function attUploadFiles(files){
  if(!files||!files.length) return;
  const {entityType,entityId}=_attCtx; let ok=0;
  for(const f of files){
    const fd=new FormData(); fd.append('entity_type',entityType); fd.append('entity_id',entityId); fd.append('file',f);
    try{ const t=tok();
      const res=await fetch('/api/attachments',{method:'POST',headers:t?{'Authorization':'Bearer '+t}:{},body:fd});
      if(res.status===401){ localStorage.removeItem('acc-token'); showLogin(); return; }
      if(!res.ok){ const j=await res.json().catch(()=>({})); toast((j.detail||'Upload failed')+' — '+f.name); continue; }
      ok++;
    }catch(e){ toast(e.message); }
  }
  if(ok) toast(ok+' document'+(ok>1?'s':'')+' uploaded.',true);
  attRefresh();
}
async function attRefresh(){
  const {entityType,entityId,mountId}=_attCtx; const el=document.getElementById(mountId); if(!el) return;
  const qs=`entity_type=${encodeURIComponent(entityType)}&entity_id=${encodeURIComponent(entityId)}`;
  try{
    const [list,st]=await Promise.all([api('/attachments?'+qs), api('/attachments/status?'+qs)]);
    const [em,lb]=ATT_STATUS[st.code]||['⚪',st.label];
    const badge=el.querySelector('#att_badge'); if(badge) badge.innerHTML=`· ${em} ${esc(lb)} (${st.count})`;
    const listEl=el.querySelector('#att_list'); if(!listEl) return;
    if(!list.length){ listEl.innerHTML='<div class="muted" style="font-size:13px">No documents attached yet.</div>'; return; }
    listEl.innerHTML=`<div class="scroll"><table><thead><tr><th>File name</th><th>Type</th><th class="num">Size</th><th>Uploaded</th><th>By</th><th>Status</th><th></th></tr></thead>
      <tbody>${list.map(attRow).join('')}</tbody></table></div>`;
  }catch(e){ /* modal may have closed */ }
}
function attRow(a){
  const [em,lb]=attFileBadge(a);
  const match = a.match_status==='mismatch' ? ` <span style="color:var(--danger,#b91c1c)">⚠️ diff ${money(a.match_difference)}</span>`
              : a.match_status==='matched' ? ' <span style="color:var(--ok,#1a7f37)">✓</span>' : '';
  const acts=`<button class="btn" onclick="attView('${a.id}',${a.can_preview})">${a.can_preview?'View':'Download'}</button>
    <button class="btn" onclick="attDetails('${a.id}')">Details</button>
    <button class="btn" onclick="attRename('${a.id}')">Rename</button>
    <button class="btn" onclick="attReplace('${a.id}')">Replace</button>
    ${a.review_status!=='reviewed'?`<button class="btn" onclick="attReview('${a.id}')">Review</button>`:''}
    <button class="btn btn-danger" onclick="attDelete('${a.id}')">Delete</button>`;
  return `<tr><td>${esc(a.display_name)}${match}</td><td>${esc(a.file_ext.toUpperCase())}</td><td class="num">${fmtBytes(a.file_size)}</td>
    <td>${(a.uploaded_at||'').slice(0,10)}</td><td class="muted">${esc(a.uploaded_by)}</td><td style="white-space:nowrap">${em} ${lb}</td>
    <td class="right" style="white-space:nowrap">${acts}</td></tr>`;
}
function attView(id, canPreview){ window.open(withTok('/api/attachments/'+id+'/download?disposition='+(canPreview?'inline':'attachment')),'_blank'); }
function attRename(id){
  const name=prompt('New file name:'); if(name===null) return;
  api('/attachments/'+id,{method:'PATCH',body:JSON.stringify({display_name:name})}).then(()=>{toast('Renamed.',true);attRefresh();}).catch(e=>toast(e.message));
}
function attReview(id){
  api('/attachments/'+id+'/review',{method:'POST',body:JSON.stringify({note:'Reviewed'})}).then(()=>{toast('Marked reviewed.',true);attRefresh();}).catch(e=>toast(e.message));
}
function attDelete(id){
  if(!confirm('Delete this attachment? It stays in the audit trail.')) return;
  api('/attachments/'+id,{method:'DELETE'}).then(()=>{toast('Deleted.',true);attRefresh();}).catch(e=>toast(e.message));
}
function attReplace(id){
  const inp=document.createElement('input'); inp.type='file';
  inp.onchange=async()=>{ if(!inp.files.length) return; const fd=new FormData(); fd.append('file',inp.files[0]);
    try{ const t=tok(); const res=await fetch('/api/attachments/'+id+'/replace',{method:'POST',headers:t?{'Authorization':'Bearer '+t}:{},body:fd});
      if(!res.ok){ const j=await res.json().catch(()=>({})); toast(j.detail||'Replace failed'); return; }
      toast('Attachment replaced.',true); attRefresh();
    }catch(e){ toast(e.message); } };
  inp.click();
}
async function attDetails(id){
  try{
    const a=await api('/attachments/'+id);
    const ev=await api('/attachments/'+id+'/events');
    const f=a.extracted||{};
    const fieldRows=Object.keys(f).length?Object.entries(f).map(([k,v])=>`<tr><td class="muted">${esc(k.replace(/_/g,' '))}</td><td>${esc(v)}</td></tr>`).join(''):'<tr><td colspan="2" class="muted">No fields extracted.</td></tr>';
    let banner;
    if(a.match_status==='matched') banner=`<div class="banner b-ok">Transaction ${money(a.transaction_amount)} = Document ${money(f.gross_amount)} · <b>Matched</b></div>`;
    else if(a.match_status==='mismatch') banner=`<div class="banner b-err">⚠️ <b>Mismatch</b> — Transaction ${money(a.transaction_amount)} vs Document ${money(f.gross_amount)} · Difference ${money(a.match_difference)}</div>`;
    else banner=`<div class="banner b-warn">${a.extraction_status==='unsupported'?'Extraction not available for this file type (image OCR / legacy .doc) — manual review.':'No comparable amount extracted.'}</div>`;
    const url=withTok('/api/attachments/'+id+'/download?disposition=inline');
    let preview;
    if(['jpg','jpeg','png','gif','webp'].includes(a.file_ext)) preview=`<img src="${url}" style="max-width:100%;border:1px solid var(--border);border-radius:8px">`;
    else if(a.file_ext==='pdf') preview=`<iframe src="${url}" style="width:100%;height:52vh;border:1px solid var(--border);border-radius:8px"></iframe>`;
    else preview=`<div class="muted">No inline preview for ${esc(a.file_ext.toUpperCase())}. <a style="color:var(--brand)" href="${withTok('/api/attachments/'+id+'/download')}" target="_blank">Download</a></div>`;
    const evs=ev.slice().reverse().map(e=>`<tr><td class="muted" style="white-space:nowrap">${(e.at||'').slice(0,19).replace('T',' ')}</td><td>${esc(e.actor)}</td><td><b>${esc(e.action)}</b></td><td>${esc(e.note||'')}</td></tr>`).join('');
    modal(`<div class="row"><div><div class="muted">Attachment · AI extraction &amp; validation</div><h1 style="margin:0">${esc(a.display_name)}</h1>
      <div class="muted">${esc(a.file_ext.toUpperCase())} · ${fmtBytes(a.file_size)} · uploaded by ${esc(a.uploaded_by)} · ${(a.uploaded_at||'').slice(0,10)}</div></div>
      <button class="x" onclick="closeModal()">✕</button></div>
      ${banner}
      <div class="grid" style="grid-template-columns:1.1fr .9fr;gap:16px;align-items:start;margin-top:10px">
        <div>${preview}</div>
        <div>${card(`<div class="pad"><b>Extracted fields</b><table class="mt">${fieldRows}</table></div>`)}
          <div class="mt">${card(`<div class="pad"><b>Audit trail</b><div class="scroll mt" style="max-height:26vh"><table><thead><tr><th>When (UTC)</th><th>Actor</th><th>Action</th><th>Note</th></tr></thead><tbody>${evs}</tbody></table></div></div>`)}</div>
        </div>
      </div>`,'max-width:980px');
  }catch(e){ toast(e.message); }
}

// Shared document actions: Print / Download PDF / Archive to attachments. `pdfPath` is the
// PDF endpoint; `kind`+`id` drive the archive endpoint. Refreshes the attachments panel after archive.

  return `<a class="btn" target="_blank" href="${u}" title="Print (opens print-ready PDF)">🖨 Print</a>

    <a class="btn" target="_blank" href="${xl}">Export Excel</a>
    <button class="btn" onclick="archiveDoc('${kind}','${id}')">Archive PDF</button>`;
}
async function archiveDoc(kind, id){
  try{ await api('/documents/'+kind+'/'+id+'/archive-pdf',{method:'POST'});
    toast('PDF archived to attachments.',true); if(typeof attRefresh==='function') attRefresh();
  }catch(e){ toast(e.message); }
}

// Open a standalone attachments modal for any transaction entity (bank line, payment, …).
function openEntityDocs(entityType, entityId, title){
  modal(`<div class="row"><div><div class="muted">Attachments</div><h1 style="margin:0">${esc(title)}</h1></div>
    <button class="x" onclick="closeModal()">✕</button></div><div id="attMount"></div>`,'max-width:820px');
  mountAttachments(entityType, entityId);
}
// Render a payments sub-list (with per-payment doc status) inside an invoice/bill modal.
async function loadPayList(kind, id){
  const el=document.getElementById('payList'); if(!el) return;
  const path=kind==='sales'?'/sales/invoices/'+id+'/payments':'/purchases/bills/'+id+'/payments';
  const etype=kind==='sales'?'customer_payment':'bill_payment';
  try{
    const pays=await api(path); if(!pays.length){ el.innerHTML=''; return; }
    const st=await api('/attachments/status-bulk?entity_type='+etype+'&ids='+encodeURIComponent(pays.map(p=>p.id).join(',')));
    const rows=pays.map(p=>{ const s=st[p.id]||{code:'none',count:0}; const em=(ATT_STATUS[s.code]||['⚪'])[0];
      return `<tr><td>${p.date}</td><td class="num">${money(p.amount)}</td><td>${esc(p.reference||'—')}</td>
        <td>${em}${s.count?(' ('+s.count+')'):''}</td>
        <td class="right" style="white-space:nowrap"><a class="btn" target="_blank" href="${withTok('/api/'+(kind==='sales'?'sales':'purchases')+'/payments/'+p.id+'/receipt')}">Receipt</a>
          <button class="btn" onclick="openEntityDocs('${etype}','${p.id}','Payment ${p.date}')">📎 Documents</button>
          <button class="btn-danger" onclick="voidPayment('${kind}','${p.id}')">Void</button></td></tr>`; }).join('');
    el.innerHTML=`<div class="mt" style="border-top:1px solid var(--border);padding-top:12px"><b>Payments &amp; receipts</b>
      <div class="scroll mt"><table><thead><tr><th>Date</th><th class="num">Amount</th><th>Reference</th><th>Docs</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }catch(e){ /* modal may have closed */ }
}

async function voidPayment(kind, payId){
  const reason=prompt('Reason for voiding this payment (it will be reversed out of the ledger and the outstanding balance restored):','');
  if(reason===null) return;
  const base=kind==='sales'?'/sales/payments/':'/purchases/payments/';
  try{ await api(base+payId+'/void'+(reason?('?reason='+encodeURIComponent(reason)):''),{method:'POST'});
    closeModal(); toast('Payment voided — balance restored.',true); render(); }catch(e){ toast(e.message); }
}

// ── Modal helpers ───────────────────────────────────────────────────────────
function modal(html, style=''){ closeModal(); const o=document.createElement('div'); o.className='overlay'; o.id='overlay';
  o.innerHTML=`<div class="card modal pad" ${style?`style="${style}"`:''}>${html}</div>`; o.onclick=e=>{ if(e.target===o) closeModal(); }; document.body.appendChild(o); }
function closeModal(){ const o=$('#overlay'); if(o) o.remove(); }

// boot
// ── Auth / login gate ─────────────────────────────────────────────────────────
function showLogin(){
  if(document.getElementById('loginOverlay')) return;
  const d=document.createElement('div'); d.id='loginOverlay'; d.className='overlay';
  d.innerHTML=`<div class="card pad" style="max-width:360px;width:100%">
    <div class="brand" style="padding:0 0 12px"><div class="logo">₳</div><div><b>Accounting</b><small>Sign in to continue</small></div></div>
    <div id="lg_err"></div>
    <label class="mb"><span class="lbl">Username</span><input id="lg_user"></label>
    <label class="mb"><span class="lbl">Password</span><input id="lg_pw" type="password"></label>
    <button class="btn-primary" id="lg_go" style="width:100%">Sign in</button>
    <div style="text-align:center;margin-top:10px"><a id="lg_forgot" style="cursor:pointer;color:var(--brand);font-size:13px">Forgot password?</a></div></div>`;
  document.body.appendChild(d);
  const submit=async()=>{ try{
      const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:document.getElementById('lg_user').value,password:document.getElementById('lg_pw').value})});
      if(!res.ok){ const j=await res.json().catch(()=>({})); document.getElementById('lg_err').innerHTML=`<div class="banner b-err">${esc(j.detail||'Sign-in failed')}</div>`; return; }
      const data=await res.json(); localStorage.setItem('acc-token',data.access_token); localStorage.setItem('acc-user',JSON.stringify(data.user));
      d.remove(); if(!location.hash) location.hash='dashboard'; current=location.hash.slice(1); render(); updateUserChip();
      if(data.user&&data.user.must_change_password){ toast('Your password was reset by an administrator — please set a new one.'); changePassword(); }
    }catch(e){ document.getElementById('lg_err').innerHTML=`<div class="banner b-err">${esc(e.message)}</div>`; } };
  document.getElementById('lg_go').onclick=submit;
  document.getElementById('lg_pw').addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
  document.getElementById('lg_forgot').onclick=forgotPassword;
  document.getElementById('lg_user').focus();
}
// Strong-password client check mirrors the server policy (≥8 chars, ≥3 of 4 classes).
function strongPw(pw){ if(!pw||pw.length<8) return false;
  const cls=[/[a-z]/.test(pw),/[A-Z]/.test(pw),/[0-9]/.test(pw),/[^A-Za-z0-9]/.test(pw)].filter(Boolean).length;
  return cls>=3; }
const PW_HINT='at least 8 characters incl. 3 of: lowercase, uppercase, number, symbol';
function forgotPassword(){
  modal(`<div class="row"><h1 style="margin:0">Reset your password</h1><button class="x" onclick="closeModal()">✕</button></div>
    <p class="sub">Enter your username or registered email. If an account matches, you'll receive a reset link.</p>
    <div id="fp_step1">
      <label class="mb mt"><span class="lbl">Username or email</span><input id="fp_id"></label>
      <div class="flex" style="justify-content:flex-end"><button class="btn-primary" id="fp_go">Send reset link</button></div></div>
    <div id="fp_step2" style="display:none">
      <div class="banner b-ok mt" id="fp_ack"></div>
      <label class="mb mt"><span class="lbl">Reset token</span><input id="fp_tok" placeholder="paste the token from your email"></label>
      <label class="mb"><span class="lbl">New password</span><input type="password" id="fp_new"></label>
      <label class="mb"><span class="lbl">Confirm new password</span><input type="password" id="fp_conf"></label>
      <div class="muted mb" style="font-size:12px">Password: ${PW_HINT}.</div>
      <div class="flex" style="justify-content:flex-end"><button class="btn-primary" id="fp_reset">Set new password</button></div></div>`,'max-width:460px');
  $('#fp_go').onclick=async()=>{ const id=$('#fp_id').value.trim(); if(!id){ toast('Enter your username or email.'); return; }
    try{ const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:id})});
      const j=await r.json().catch(()=>({}));
      if(r.status===429){ toast(j.detail||'Too many requests.'); return; }
      $('#fp_step1').style.display='none'; $('#fp_step2').style.display='';
      $('#fp_ack').textContent=j.message||'If an account matches, a reset link has been sent.';
      if(j.reset_token){ $('#fp_tok').value=j.reset_token; $('#fp_ack').textContent+=' (Dev mode: token pre-filled below.)'; }
    }catch(e){ toast(e.message); } };
  $('#fp_reset').onclick=async()=>{ const t=$('#fp_tok').value.trim(), nw=$('#fp_new').value, cf=$('#fp_conf').value;
    if(!t){ toast('Enter the reset token.'); return; }
    if(!strongPw(nw)){ toast('Password must be '+PW_HINT+'.'); return; }
    if(nw!==cf){ toast('Passwords do not match.'); return; }
    try{ const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t,new_password:nw})});
      const j=await r.json().catch(()=>({})); if(!r.ok){ toast(j.detail||'Reset failed.'); return; }
      closeModal(); toast('Password updated — please sign in.',true);
    }catch(e){ toast(e.message); } };
}
function currentUser(){ try{ return JSON.parse(localStorage.getItem('acc-user')||'null'); }catch(e){ return null; } }
function isAdmin(){ if(!window._authEnabled) return true; const u=currentUser(); return !!u && u.role==='admin'; }
function updateUserChip(){
  const el=document.getElementById('userChip'); if(!el) return;
  if(!window._authEnabled){ el.innerHTML=''; return; }
  let u=null; try{ u=JSON.parse(localStorage.getItem('acc-user')||'null'); }catch(e){}
  el.innerHTML=`${u?esc(u.username)+(u.role?` <span class="muted">(${esc(u.role)})</span>`:'')+' · ':''}<a style="cursor:pointer;color:var(--brand)" onclick="changePassword()">Change password</a> · <a style="cursor:pointer;color:var(--brand)" onclick="logout()">Sign out</a>`;
}
function changePassword(){
  modal(`<div class="row"><h1 style="margin:0">Change password</h1><button class="x" onclick="closeModal()">✕</button></div>
    <label class="mb mt"><span class="lbl">Current password</span><input type="password" id="cp_cur"></label>
    <label class="mb"><span class="lbl">New password</span><input type="password" id="cp_new"></label>
    <label class="mb"><span class="lbl">Confirm new password</span><input type="password" id="cp_conf"></label>
    <div class="muted mb" style="font-size:12px">Password: ${PW_HINT}.</div>
    <div class="flex" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" id="cp_go">Update password</button></div>`,'max-width:460px');
  $('#cp_go').onclick=async()=>{
    const cur=$('#cp_cur').value, nw=$('#cp_new').value, cf=$('#cp_conf').value;
    if(!strongPw(nw)){ toast('New password must be '+PW_HINT+'.'); return; }
    if(nw!==cf){ toast('New password and confirmation do not match.'); return; }
    try{ await api('/auth/change-password',{method:'POST',body:JSON.stringify({current_password:cur,new_password:nw})});
      closeModal(); toast('Password updated.',true);
    }catch(e){ toast(e.message); } };
}
function logout(){ localStorage.removeItem('acc-token'); localStorage.removeItem('acc-user'); showLogin(); }
async function boot(){
  let cfg={auth_enabled:false};
  try{ cfg=await (await fetch('/api/auth/config')).json(); }catch(e){}
  window._authEnabled=cfg.auth_enabled;
  if(cfg.auth_enabled && !tok()){ showLogin(); return; }
  if(!location.hash) location.hash='dashboard'; current=location.hash.slice(1);
  render(); updateUserChip(); loadOrgHeader(); loadProjectCodes(); loadVatTreatments();
}
async function loadVatTreatments(){ try{ window._vatTreatments=await api('/vat-treatments?active_only=true'); }catch(e){ window._vatTreatments=[]; } }
function vatTreatmentOptions(sel){ const ts=window._vatTreatments||[];
  const opts = ts.length ? ts : [{code:'SR',rate:'0.05'},{code:'ZR',rate:'0'}];
  return opts.map(t=>`<option value="${t.code}" data-rate="${t.rate}"${sel===t.code?' selected':''}>${t.code} ${(Number(t.rate)*100).toFixed(0)}%</option>`).join(''); }
async function loadOrgHeader(){
  try{ const o=await api('/organization');
    const bn=$('#brandName'); if(bn&&o.name) bn.textContent=o.name;
    const sub=$('#brandSub'); if(sub) sub.textContent=o.trn?('TRN '+o.trn):'UAE VAT';
    const lg=$('#brandLogo');
    if(lg&&o.has_logo){ lg.innerHTML=`<img src="${withTok('/api/organization/logo?v='+encodeURIComponent(o.updated_at||''))}" style="width:100%;height:100%;object-fit:contain">`; lg.style.background='transparent'; }
    else if(lg){ lg.textContent='₳'; }
  }catch(e){}
}
boot();
</script>
