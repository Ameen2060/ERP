<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Accounting</title>
<style>
  :root {
    --bg:#f6f7f9; --surface:#fff; --elevated:#f0f2f5; --border:#e3e6ea; --fg:#1a1d21;
    --muted:#6b7280; --brand:#2563eb; --brand-fg:#fff; --success:#16a34a; --warning:#d97706; --danger:#dc2626;
    --shadow:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --surface:#171a21; --elevated:#1f242d; --border:#2a2f3a; --fg:#e6e8eb;
      --muted:#9aa3af; --brand:#3b82f6; --shadow:0 1px 3px rgba(0,0,0,.4); }
  }
  :root[data-theme="dark"] { --bg:#0f1115; --surface:#171a21; --elevated:#1f242d; --border:#2a2f3a; --fg:#e6e8eb;
      --muted:#9aa3af; --brand:#3b82f6; --shadow:0 1px 3px rgba(0,0,0,.4); }
  :root[data-theme="light"] { --bg:#f6f7f9; --surface:#fff; --elevated:#f0f2f5; --border:#e3e6ea; --fg:#1a1d21;
      --muted:#6b7280; --brand:#2563eb; --shadow:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.1); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  a { color:var(--brand); }
  .layout { display:flex; min-height:100vh; }
  aside { width:230px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); padding:16px 10px; }
  .brand { display:flex; align-items:center; gap:10px; padding:6px 10px 16px; }
  .logo { width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-fg);display:flex;align-items:center;justify-content:center;font-weight:700; }
  .brand b { font-size:15px; } .brand small { display:block;color:var(--muted);font-size:11px; }
  nav a { display:block; padding:9px 12px; border-radius:8px; color:var(--muted); text-decoration:none; font-size:14px; font-weight:500; margin-bottom:2px; cursor:pointer; }
  nav a:hover { background:var(--elevated); color:var(--fg); }
  nav a.active { background:var(--brand); color:var(--brand-fg); }
  .nav-sec { font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:12px 12px 4px; }
  main { flex:1; min-width:0; }
  header { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between;
    background:color-mix(in srgb,var(--surface) 85%,transparent); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border); padding:12px 24px; }
  header .title { font-size:13px; color:var(--muted); }
  .content { max-width:1080px; margin:0 auto; padding:22px 24px; }
  h1 { font-size:20px; margin:0 0 3px; } .sub { color:var(--muted); font-size:14px; margin:0 0 18px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); }
  .card-h { padding:12px 16px; border-bottom:1px solid var(--border); font-weight:600; font-size:14px; }
  .pad { padding:16px; }
  button, .btn { font:inherit; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--fg);
    padding:8px 13px; font-size:14px; font-weight:500; cursor:pointer; }
  button:hover { background:var(--elevated); }
  .btn-primary { background:var(--brand); color:var(--brand-fg); border-color:transparent; }
  .btn-primary:hover { filter:brightness(1.07); background:var(--brand); }
  .btn-danger { color:var(--danger); border-color:color-mix(in srgb,var(--danger) 40%,transparent); background:transparent; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input, select { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--fg); width:100%; }
  label { font-size:13px; display:block; } label .lbl { display:block; color:var(--muted); font-size:12px; margin-bottom:4px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:11px; text-transform:uppercase; color:var(--muted); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--border); }
  td { padding:8px 10px; border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent); }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--elevated); }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--muted); }
  .grid { display:grid; gap:12px; }
  .kpis { grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); }
  .kpi { padding:14px 16px; } .kpi .k { font-size:12px; color:var(--muted); } .kpi .v { font-size:22px; font-weight:700; margin-top:4px; }
  .card.drill { cursor:pointer; transition:border-color .12s, transform .06s; }
  .card.drill:hover { border-color:var(--brand); transform:translateY(-1px); }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:10px; font-weight:600; text-transform:uppercase; }
  .p-posted{background:color-mix(in srgb,var(--brand) 15%,transparent);color:var(--brand);}
  .p-paid{background:color-mix(in srgb,var(--success) 15%,transparent);color:var(--success);}
  .p-partial,.p-draft{background:color-mix(in srgb,var(--warning) 18%,transparent);color:var(--warning);}
  .p-void{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger);}
  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .tabs button { border:none; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--muted); padding:9px 14px; }
  .tabs button.active { color:var(--fg); border-bottom-color:var(--brand); }
  .banner { border-radius:8px; padding:9px 14px; font-size:13px; margin-bottom:14px; }
  .b-ok { border:1px solid color-mix(in srgb,var(--success) 40%,transparent); background:color-mix(in srgb,var(--success) 10%,transparent); color:var(--success); }
  .b-err { border:1px solid color-mix(in srgb,var(--danger) 40%,transparent); background:color-mix(in srgb,var(--danger) 10%,transparent); color:var(--danger); }
  .b-warn { border:1px solid color-mix(in srgb,var(--warning) 40%,transparent); background:color-mix(in srgb,var(--warning) 12%,transparent); color:var(--warning); }
  .empty { text-align:center; color:var(--muted); padding:36px; font-size:14px; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal { max-height:86vh; overflow:auto; width:100%; max-width:640px; }
  .flex { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .muted { color:var(--muted); } .right{ text-align:right; } .mb{ margin-bottom:14px; } .mt{ margin-top:14px; }
  .scroll { overflow-x:auto; }
  #toast { position:fixed; bottom:20px; right:20px; z-index:100; }
  .x { background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:0 4px; }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand" id="brand"><div class="logo" id="brandLogo">₳</div><div><b id="brandName">Accounting</b><small id="brandSub">Double-entry · UAE</small></div></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <header>
      <div class="title" id="crumb">Dashboard</div>
      <div class="flex" style="align-items:center">
        <div style="position:relative">
          <input id="gsearch" placeholder="Search everything…  (/)" autocomplete="off" style="width:230px;padding:6px 10px">
          <div id="gsearch_res" style="display:none;position:absolute;right:0;top:110%;z-index:50;width:360px;max-height:60vh;overflow:auto;background:var(--card,#fff);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18)"></div>
        </div>
        <button id="seedBtn" title="Create the default Chart of Accounts">Seed accounts</button>
        <span id="userChip" style="font-size:12px;color:var(--muted)"></span>
        <button id="themeBtn" title="Toggle theme">◐</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="toast"></div>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const money = v => Number(v||0).toLocaleString('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2});
const moneyBlank = v => Number(v)===0 ? '' : money(v);
const today = () => new Date().toISOString().slice(0,10);
const yearStart = () => new Date().getFullYear()+'-01-01';
const plusDays = d => { const x=new Date(); x.setDate(x.getDate()+d); return x.toISOString().slice(0,10); };
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const tok=()=>localStorage.getItem('acc-token');
const withTok=(u)=>{ const t=tok(); return t?u+(u.includes('?')?'&':'?')+'token='+encodeURIComponent(t):u; };
async function api(path, opts={}) {
  const t=tok();
  const headers={'Content-Type':'application/json', ...(t?{'Authorization':'Bearer '+t}:{}), ...(opts.headers||{})};
  const res = await fetch('/api'+path, { ...opts, headers });
  if (res.status===401){ localStorage.removeItem('acc-token'); showLogin(); throw new Error('Session expired — please sign in.'); }
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = (Array.isArray(j.detail)? j.detail.map(d=>d.msg).join('; ') : j.detail) || detail; } catch(e){}
    throw new Error(detail);
  }
  return res.status===204 ? null : res.json();
}
function toast(msg, ok=false){
  const t=document.createElement('div'); t.className='banner '+(ok?'b-ok':'b-err'); t.textContent=msg;
  $('#toast').appendChild(t); setTimeout(()=>t.remove(), 4200);
}

// theme
const root=document.documentElement;
const savedTheme=localStorage.getItem('acc-theme'); if(savedTheme) root.setAttribute('data-theme',savedTheme);
$('#themeBtn').onclick=()=>{ const cur=root.getAttribute('data-theme')|| (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next=cur==='dark'?'light':'dark'; root.setAttribute('data-theme',next); localStorage.setItem('acc-theme',next); };

$('#seedBtn').onclick=async()=>{ try{ const r=await api('/accounts/seed',{method:'POST'}); toast(`Chart of Accounts ready (${r.added} added, ${r.total} total).`,true); render(); }catch(e){ toast(e.message); } };

// ── Global search ───────────────────────────────────────────────────────────
let _gsTimer=null;
function gsRun(fn, args){ closeGSearch(); const g=$('#gsearch'); if(g) g.value=''; try{ window[fn](...args); }catch(e){ toast(e.message); } }
function closeGSearch(){ const r=$('#gsearch_res'); if(r){ r.style.display='none'; r.innerHTML=''; } }
async function doGlobalSearch(q){
  const box=$('#gsearch_res'); if(!box) return;
  if((q||'').trim().length<2){ closeGSearch(); return; }
  try{ const d=await api('/search?q='+encodeURIComponent(q));
    if(!d.groups.length){ box.innerHTML='<div class="pad muted" style="padding:10px">No matches.</div>'; box.style.display=''; return; }
    box.innerHTML=d.groups.map(g=>`<div style="padding:6px 10px;font-size:11px;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--border)">${esc(g.label)}</div>`+
      g.hits.map(h=>`<div class="gs-hit" style="padding:8px 10px;cursor:pointer;border-top:1px solid var(--border)" onclick='gsRun(${JSON.stringify(h.open.fn)}, ${JSON.stringify(h.open.args)})'>
        <div style="font-weight:600">${esc(h.title)}</div><div class="muted" style="font-size:12px">${esc(h.sub||'')}</div></div>`).join('')).join('');
    box.style.display='';
  }catch(e){ closeGSearch(); }
}
(function wireSearch(){ const g=$('#gsearch'); if(!g) return;
  g.addEventListener('input',()=>{ clearTimeout(_gsTimer); _gsTimer=setTimeout(()=>doGlobalSearch(g.value),250); });
  g.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeGSearch(); g.blur(); } });
  document.addEventListener('click',e=>{ if(!e.target.closest('#gsearch')&&!e.target.closest('#gsearch_res')) closeGSearch(); });
  document.addEventListener('keydown',e=>{ if(e.key==='/'&&document.activeElement!==g&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){ e.preventDefault(); g.focus(); } });
})();

// ── Router ────────────────────────────────────────────────────────────────
const VIEWS = [
  {id:'dashboard', label:'Dashboard', sec:'Overview'},
  // Operational / data-entry
  {id:'accounts', label:'Chart of Accounts', sec:'General Ledger'},
  {id:'journal', label:'Journal Entries', sec:'General Ledger'},
  {id:'customers', label:'Customers', sec:'Sales'},
  {id:'invoices', label:'Sales Invoices', sec:'Sales'},
  {id:'customerCreditNotes', label:'Customer Credit Notes', sec:'Sales'},
  {id:'customerAdvances', label:'Customer Advances', sec:'Sales'},
  {id:'recurring', label:'Recurring Invoices', sec:'Sales'},
  {id:'vendors', label:'Vendors', sec:'Purchases'},
  {id:'bills', label:'Vendor Bills', sec:'Purchases'},
  {id:'expenses', label:'Expenses', sec:'Purchases'},
  {id:'vendorCreditNotes', label:'Vendor Credit Notes', sec:'Purchases'},
  {id:'vendorAdvances', label:'Vendor Advances', sec:'Purchases'},
  {id:'bankAccounts', label:'Bank Accounts', sec:'Banking'},
  {id:'reconcile', label:'Reconciliation', sec:'Banking'},
  {id:'products', label:'Products', sec:'Inventory'},
  {id:'warehouses', label:'Warehouses', sec:'Inventory'},
  {id:'stock', label:'Stock & Valuation', sec:'Inventory'},
  {id:'assetRegister', label:'Asset Register', sec:'Fixed Assets'},
  {id:'projects', label:'Projects', sec:'Projects'},
  {id:'projectDashboard', label:'Project Dashboard', sec:'Projects'},
  {id:'budgets', label:'Budgets', sec:'Budget'},
  {id:'budgetDashboard', label:'Budget Dashboard', sec:'Budget'},
  {id:'employees', label:'Employees', sec:'Payroll'},
  {id:'payrollRuns', label:'Payroll Runs', sec:'Payroll'},
  {id:'einvDashboard', label:'E-Invoice Dashboard', sec:'E-Invoicing'},
  {id:'einvDocuments', label:'E-Invoices', sec:'E-Invoicing'},
  {id:'einvSettings', label:'E-Invoice Settings', sec:'E-Invoicing', adminOnly:true},
  {id:'organization', label:'Organization', sec:'Setup', adminOnly:true},
  {id:'systemSettings', label:'System Settings', sec:'Setup', adminOnly:true},
  {id:'vatTreatments', label:'VAT Treatments', sec:'Setup', adminOnly:true},
  {id:'docTemplates', label:'Document Templates', sec:'Setup', adminOnly:true},
  {id:'currencies', label:'Currencies & Rates', sec:'Setup'},
  {id:'users', label:'Users', sec:'Setup', adminOnly:true},
  {id:'permissions', label:'Permissions', sec:'Setup', adminOnly:true},
  {id:'exportLog', label:'Export Log', sec:'Setup', adminOnly:true},
  // Reports — a single hub; the individual reports open from inside the Report Center.
  {id:'reportCenter', label:'Report Center', sec:'Reports'},
];
let current='dashboard';
function _inCatalog(id){ return typeof REPORTS_CATALOG!=='undefined' && REPORTS_CATALOG.some(r=>r.id===id); }
function buildNav(){
  const nav=$('#nav'); nav.innerHTML=''; let sec=null;
  const viewingReport=!VIEWS.some(v=>v.id===current) && _inCatalog(current);
  for(const v of VIEWS){ if(v.adminOnly && !isAdmin()) continue;
    if(v.sec!==sec){ sec=v.sec; const h=document.createElement('div'); h.className='nav-sec'; h.textContent=sec; nav.appendChild(h); }
    const active=(v.id===current) || (v.id==='reportCenter' && viewingReport);
    const a=document.createElement('a'); a.textContent=v.label; a.className=(active?'active':''); a.onclick=()=>{ current=v.id; location.hash=v.id; }; nav.appendChild(a); }
}
window.addEventListener('hashchange',()=>{ current=(location.hash||'#dashboard').slice(1); render(); });
function render(){ buildNav();
  const cat=typeof REPORTS_CATALOG!=='undefined' ? REPORTS_CATALOG.find(x=>x.id===current) : null;
  const v=VIEWS.find(x=>x.id===current)||cat||VIEWS[0];
  $('#crumb').innerHTML = cat && current!=='reportCenter'
    ? `<span style="cursor:pointer;color:var(--brand)" onclick="location.hash='reportCenter'">Report Center</span> › ${esc(cat.label)}`
    : esc(v.label);
  VIEW[current]?.(); }

const C=$('#content');
const card=(inner,cls='')=>`<div class="card ${cls}">${inner}</div>`;

// ── Dashboard ─────────────────────────────────────────────────────────────
const VIEW={};

// ── Report Center — catalog hub for all reports ───────────────────────────────
const REPORTS_CATALOG = [
  {id:'trial', label:'Trial Balance', cat:'Accounting', desc:'Classified balances by category; drill to account ledger → journal entry'},
  {id:'ledger', label:'General Ledger', cat:'Accounting', desc:'Every posted movement per account; drill to journal entry'},
  {id:'accounts', label:'Chart of Accounts', cat:'Accounting', desc:'Account structure, types and normal balances'},
  {id:'statements', label:'Financial Statements', cat:'Accounting', desc:'P&L, Balance Sheet, Cash Flow; drill line → account'},
  {id:'arAging', label:'Accounts Receivable — Aging', cat:'Accounts Receivable', desc:'Outstanding by customer & age, with risk; drill to invoices'},
  {id:'salesByCustomer', label:'Sales by Customer', cat:'Accounts Receivable', desc:'Sales grouped; drill to the invoice'},
  {id:'customerStatement', label:'Customer Statement', cat:'Accounts Receivable', desc:'Opening balance, invoices & receipts, running balance'},
  {id:'apAging', label:'Accounts Payable — Aging', cat:'Accounts Payable', desc:'Outstanding by vendor & age; drill to bills'},
  {id:'invByVendor', label:'Invoice by Vendor', cat:'Accounts Payable', desc:'Purchases grouped; drill to the bill'},
  {id:'vendorStatement', label:'Vendor Statement', cat:'Accounts Payable', desc:'Opening balance, bills & payments, running balance'},
  {id:'vatReturn', label:'VAT Return (VAT201)', cat:'VAT', desc:'FTA VAT201 boxes, reconciled to the GL VAT accounts'},
  {id:'faf', label:'VAT Audit File (FAF)', cat:'VAT', desc:'FTA audit workbook (return + transaction listings)'},
  {id:'vatByTreatment', label:'VAT by Treatment', cat:'VAT', desc:'Net, output & input VAT grouped by VAT treatment (SR/ZR/EX/OS/RC)'},
  {id:'ctComputation', label:'Corporate Tax — Computation', cat:'Corporate Tax', desc:'Accounting profit → taxable income → CT payable (PROVISIONAL)'},
  {id:'ctReviews', label:'Corporate Tax — Review & Validation', cat:'Corporate Tax', desc:'Mandatory SME validation: per-line sign-off, filing-block, audit trail'},
  {id:'expenseReport', label:'Expense Report', cat:'Expenses', desc:'Direct & payable expenses grouped by category / vendor / project, with VAT'},
  {id:'retentionCustomer', label:'Customer Retention Receivable', cat:'Retention', desc:'Held retention by invoice — outstanding, released, due for release'},
  {id:'retentionVendor', label:'Vendor Retention Payable', cat:'Retention', desc:'Held retention by bill — outstanding, released, due for release'},
  {id:'projectDashboard', label:'Project Financials', cat:'Projects', desc:'Portfolio revenue, cost, gross profit, receivables/payables; drill to project'},
  {id:'budgetDashboard', label:'Budget vs Actual', cat:'Budget', desc:'Approved budgets vs ledger actuals — variance, utilisation, alerts; drill to budget'},
  {id:'cnReportCustomer', label:'Customer Credit Notes', cat:'Credit Notes', desc:'Credit notes issued to customers: total, applied, unapplied, VAT'},
  {id:'cnReportVendor', label:'Vendor Credit Notes', cat:'Credit Notes', desc:'Credit notes received from vendors: total, applied, unapplied, VAT'},
  {id:'advReportCustomer', label:'Customer Advance Balances', cat:'Advances', desc:'Customer advances: amount, applied, available (unapplied)'},
  {id:'advReportVendor', label:'Vendor Advance Balances', cat:'Advances', desc:'Vendor advances: amount, applied, available (unapplied)'},
  {id:'advApplyCustomer', label:'Customer Advance Applications', cat:'Advances', desc:'Every customer advance applied to an invoice; drill to advance/invoice/JE'},
  {id:'advApplyVendor', label:'Vendor Advance Applications', cat:'Advances', desc:'Every vendor advance applied to a bill; drill to advance/bill/JE'},
  {id:'advAgeCustomer', label:'Customer Advance Aging', cat:'Advances', desc:'Outstanding customer advances bucketed by age'},
  {id:'advAgeVendor', label:'Vendor Advance Aging', cat:'Advances', desc:'Outstanding vendor advances bucketed by age'},
  {id:'inventoryValuation', label:'Inventory Valuation', cat:'Inventory', desc:'On-hand quantity, avg cost & value; reconciled to GL Inventory'},
  {id:'productSales', label:'Sales by Product', cat:'Inventory', desc:'Stock issued per product (quantity & cost)'},
  {id:'productPurchases', label:'Purchases by Product', cat:'Inventory', desc:'Stock received per product (quantity & cost)'},
  {id:'dashboard', label:'Executive Dashboard', cat:'Management', desc:'Live KPIs with drill-down to underlying records'},
];
const RC_CATS = ['Accounting','Accounts Receivable','Accounts Payable','VAT','Corporate Tax','Expenses','Credit Notes','Retention','Advances','Projects','Budget','Inventory','Management'];
const _favKey='acc-fav-reports', _recentKey='acc-recent-reports';
const getFavs=()=>{ try{ return JSON.parse(localStorage.getItem(_favKey)||'[]'); }catch(e){ return []; } };
const getRecent=()=>{ try{ return JSON.parse(localStorage.getItem(_recentKey)||'[]'); }catch(e){ return []; } };
function toggleFav(id){ const f=getFavs(); const i=f.indexOf(id); if(i>=0)f.splice(i,1); else f.push(id); localStorage.setItem(_favKey,JSON.stringify(f)); VIEW.reportCenter(); }
function openReport(id){ const r=getRecent().filter(x=>x!==id); r.unshift(id); localStorage.setItem(_recentKey,JSON.stringify(r.slice(0,6))); location.hash=id; }
let rcSearch='', rcCat='';
VIEW.reportCenter=()=>{
  const favs=getFavs(), recent=getRecent();
  const kpis=[['Total Reports',REPORTS_CATALOG.length],...RC_CATS.map(c=>[c,REPORTS_CATALOG.filter(r=>r.cat===c).length])];
  const kpiHtml=`<div class="grid kpis mb">${kpis.map(([k,v])=>`<div class="card kpi"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`).join('')}</div>`;
  const chips=['',...RC_CATS].map(c=>`<button class="btn ${rcCat===c?'btn-primary':''}" onclick="rcCat='${c.replace(/'/g,"\\'")}';VIEW.reportCenter()">${c||'All'}</button>`).join(' ');
  const rcard=(r)=>{ const fav=favs.includes(r.id);
    return `<div class="card drill" style="padding:14px" onclick="openReport('${r.id}')">
      <div class="row"><b>${esc(r.label)}</b><span onclick="event.stopPropagation();toggleFav('${r.id}')" style="cursor:pointer;font-size:16px;color:${fav?'var(--warning)':'var(--muted)'}" title="Favorite">${fav?'★':'☆'}</span></div>
      <div class="muted" style="font-size:12px;margin-top:4px">${esc(r.desc)}</div></div>`; };
  const q=rcSearch.toLowerCase();
  const match=REPORTS_CATALOG.filter(r=>(!rcCat||r.cat===rcCat)&&(!q||r.label.toLowerCase().includes(q)||r.desc.toLowerCase().includes(q)));
  const byCat=RC_CATS.filter(c=>!rcCat||c===rcCat).map(c=>{ const items=match.filter(r=>r.cat===c); if(!items.length) return '';

// ── Drill-down engine (reusable across every KPI) ─────────────────────────────
let _drill=null;
async function openDrill(key){
  try{ const d=await api('/drilldown/'+key); _drill=d;
    const cols=d.columns;
    const head=cols.map(c=>`<th class="${c.numeric?'num':''}">${esc(c.label)}</th>`).join('');
    const body=d.rows.length?d.rows.map((r,i)=>`<tr class="${r.link?'click':''}" ${r.link?`onclick="drillOpen(${i})"`:''}>
      ${cols.map(c=>`<td class="${c.numeric?'num':''}">${esc(r.cells[c.key]!==undefined?r.cells[c.key]:'')}</td>`).join('')}</tr>`).join('')
      : `<tr><td colspan="${cols.length}" class="empty">No records.</td></tr>`;
    const recBadge=d.reconciles
      ? `<span class="pill p-paid">reconciles ✓</span>`
      : `<span class="pill p-void">out by ${d.kind==='count'?(d.kpi_value-d.count):money(Number(d.kpi_value)-Number(d.computed_total))}</span>`;
    const totalLine = d.kind==='count'
      ? `${d.count} record(s)`
      : `Total ${money(d.computed_total)} · KPI ${money(d.kpi_value)}`;
    const period = d.period_start?`<span class="muted"> · ${d.period_start} → ${d.period_end}</span>`:'';
    modal(`<div class="row"><div><div class="muted">Drill-down</div><h1 style="margin:0">${esc(d.title)}</h1>
        <div class="muted">${totalLine} ${recBadge}${period}</div></div>
      <div class="flex"><button id="dr_csv">CSV</button><button class="x" onclick="closeModal()">✕</button></div></div>
      ${d.note?`<div class="banner b-err mt">${esc(d.note)}</div>`:''}
      <div class="scroll mt" style="max-height:60vh"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
      <p class="muted mt" style="font-size:12px">Every figure traces to a source record — click a row to open its journal entry or document.</p>`, 'max-width:820px');
    $('#dr_csv').onclick=()=>drillCsv(d);
  }catch(e){ toast(e.message); }
}
function drillOpen(i){
  const r=_drill.rows[i]; if(!r||!r.link) return;
  const t=r.link.type;
  if(t==='journal') openJe(r.link.id);
  else if(t==='invoice') openInv(r.link.id);
  else if(t==='bill') openBill(r.link.id);
  else if(t==='asset') openAsset(r.link.id);
}
function drillCsv(d){
  const cols=d.columns.map(c=>c.label);
  const lines=[[d.title+' — generated '+new Date().toLocaleString()], cols];
  d.rows.forEach(r=>lines.push(d.columns.map(c=>('"'+String(r.cells[c.key]??'').replace(/"/g,'""')+'"'))));
  const blob=new Blob([lines.map(l=>l.join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=d.key+'.csv'; a.click(); URL.revokeObjectURL(a.href);
}

function jeLineRow(i,l){
  l=l||{};
  const opts=jeAccounts.map(a=>`<option value="${a.id}"${l.account_id===a.id?' selected':''}>${a.code} — ${esc(a.name)}</option>`).join('');
  return `<tr><td><select class="j_acc"><option value="">Select…</option>${opts}</select></td>

    <td><input class="j_cr num" inputmode="decimal" style="width:110px" value="${l.credit&&Number(l.credit)?esc(l.credit):''}"></td>
    <td><button class="x j_del" title="remove">✕</button></td></tr>`;
}
function recalcJe(){
  let dr=0,cr=0;
  document.querySelectorAll('#j_lines tbody tr').forEach(tr=>{ dr+=parseFloat(tr.querySelector('.j_dr').value)||0; cr+=parseFloat(tr.querySelector('.j_cr').value)||0; });
  const bal=Math.abs(dr-cr)<0.005 && dr>0;
  const el=$('#j_bal'); el.textContent = bal?'Balanced ✓':(dr===0?'Enter amounts':`Out by ${money(Math.abs(dr-cr))}`);
  el.style.color = bal?'var(--success)':'var(--warning)'; $('#j_save').disabled=!bal;
  document.querySelectorAll('.j_del').forEach(b=>b.onclick=()=>{ if(document.querySelectorAll('#j_lines tbody tr').length>2){ b.closest('tr').remove(); recalcJe(); } });
}
async function saveJe(editId){
  const lines=[...document.querySelectorAll('#j_lines tbody tr')].map(tr=>{
    const acc=tr.querySelector('.j_acc').value, dr=tr.querySelector('.j_dr').value, cr=tr.querySelector('.j_cr').value;
    if(!acc||(!dr&&!cr)) return null; return {account_id:acc, debit:dr||'0', credit:cr||'0'};
  }).filter(Boolean);
  const payload={date:$('#j_date').value, memo:$('#j_memo').value||null, reference:$('#j_ref').value||null, lines};
  if(editId){
    const reason=($('#j_reason').value||'').trim();
    if(!reason){ toast('A reason for the change is required.'); return; }
    if(!confirm('Save changes to this journal entry? The ledger will be updated immediately.')) return;
    try{ await api('/journal-entries/'+editId+'?reason='+encodeURIComponent(reason),{method:'PUT',body:JSON.stringify(payload)});
      closeModal(); toast('Entry updated.',true); render(); }catch(e){ toast(e.message); }
  } else {
    try{ await api('/journal-entries',{method:'POST',body:JSON.stringify(payload)});
      closeModal(); toast('Entry posted.',true); render(); }catch(e){ toast(e.message); }
  }
}

// Prefill the shared retention section from an existing document.
function fillRetention(p, doc){
  if(!doc||!doc.retention_applicable) return;

  if($('#'+p+'_retbasis')) $('#'+p+'_retbasis').value=doc.retention_basis||'net';
  if($('#'+p+'_retpct')) $('#'+p+'_retpct').value=doc.retention_percent||'0';
  if($('#'+p+'_retamt')) $('#'+p+'_retamt').value=(doc.retention_basis==='amount'?doc.retention_amount:'0');
  if($('#'+p+'_retrel')&&doc.retention_release_date) $('#'+p+'_retrel').value=doc.retention_release_date;
  if($('#'+p+'_retref')) $('#'+p+'_retref').value=doc.retention_reference||'';

// Inline advance picker for the invoice/bill create form: lists the party's unapplied advances
// with an amount input each, to apply on save (the doc is posted first, then each advance applied).
async function loadAdvancePicker(side, mountId, partyId){
  const el=document.getElementById(mountId); if(!el) return;
  if(!partyId){ el.innerHTML=''; return; }
  const path=(side==='customer'?'/sales/advances?available=true&customer_id=':'/purchases/advances?available=true&vendor_id=')+encodeURIComponent(partyId);
  let advs=[]; try{ advs=await api(path); }catch(e){ el.innerHTML=''; return; }
  if(!advs.length){ el.innerHTML=''; return; }
  const rows=advs.map(a=>`<tr><td class="mono">${a.number}</td><td>${a.date}</td><td class="num">${money(a.available)}</td>
    <td><input class="adv_apply num" data-adv="${a.id}" data-avail="${a.available}" inputmode="decimal" placeholder="0" style="width:110px"></td></tr>`).join('');
  el.innerHTML=`<div style="border-top:1px solid var(--border);padding-top:10px">
    <label style="font-weight:600"><input type="checkbox" id="${mountId}_on"> Apply ${side} advance(s) to this ${side==='customer'?'invoice':'bill'}</label>
    <div id="${mountId}_tbl" style="display:none"><p class="muted" style="font-size:12px">Enter how much of each advance to apply. Applied after the ${side==='customer'?'invoice':'bill'} is posted; cannot exceed the available balance or the outstanding amount.</p>
    <div class="scroll"><table><thead><tr><th>Advance</th><th>Date</th><th class="num">Available</th><th class="num">Apply</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`;
  const cb=document.getElementById(mountId+'_on'); cb.onchange=()=>{ document.getElementById(mountId+'_tbl').style.display=cb.checked?'':'none'; };
}
function collectAdvanceApplications(mountId){
  const cb=document.getElementById(mountId+'_on'); if(!cb||!cb.checked) return [];
  return [...document.querySelectorAll('#'+mountId+' .adv_apply')].map(i=>({advance_id:i.dataset.adv, amount:i.value}))
    .filter(a=>Number(a.amount)>0);
}
async function applyAdvancesTo(side, targetId, apps, date){
  const results=[]; for(const a of apps){
    try{ await api('/advances/apply',{method:'POST',body:JSON.stringify({advance_type:side, advance_id:a.advance_id, target_id:targetId, amount:a.amount, date})}); results.push(null); }
    catch(e){ results.push(e.message); } }
  return results.filter(Boolean);
}
function recalcInv(){
  let net=0,vat=0;
  document.querySelectorAll('#i_lines tbody tr').forEach(tr=>{ const q=parseFloat(tr.querySelector('.i_qty').value)||0, p=parseFloat(tr.querySelector('.i_price').value)||0, sel=tr.querySelector('.i_vat'), r=parseFloat(sel.selectedOptions[0].dataset.rate)||0; net+=q*p; vat+=q*p*r; });
  $('#i_tot').innerHTML=`Net <b>${money(net)}</b> · VAT <b>${money(vat)}</b> · Total <b>${money(net+vat)}</b>`;
  document.querySelectorAll('.i_del').forEach(b=>b.onclick=()=>{ if(document.querySelectorAll('#i_lines tbody tr').length>1){ b.closest('tr').remove(); recalcInv(); } });
}
async function saveInv(editId){
  const lines=[...document.querySelectorAll('#i_lines tbody tr')].map(tr=>{
    const price=tr.querySelector('.i_price').value; if(!price) return null;
    const sel=tr.querySelector('.i_vat');
    return {description:tr.querySelector('.i_desc').value, quantity:tr.querySelector('.i_qty').value||'1', unit_price:price, vat_rate:sel.selectedOptions[0].dataset.rate, vat_treatment:sel.value, revenue_account_id:tr.querySelector('.i_acc').value||null};
  }).filter(Boolean);
  if(!$('#i_cust').value){ toast('Select a customer.'); return; }
  if(!lines.length){ toast('Add at least one line with a price.'); return; }
  const payload={customer_id:$('#i_cust').value, date:$('#i_date').value, due_date:$('#i_due').value||null, currency:($('#i_cur')?$('#i_cur').value:'AED'), exchange_rate:($('#i_rate')&&$('#i_rate').value?$('#i_rate').value:null), project:($('#i_proj')&&$('#i_proj').value?$('#i_proj').value:null), lines, ...retentionPayload('i')};
  if(editId){
    const reason=($('#i_reason').value||'').trim();
    if(!reason){ toast('A reason for the change is required.'); return; }
    if(!confirm('Save changes? The invoice is reversed and re-posted; all ledgers, VAT and reports update immediately.')) return;
    try{ await api('/sales/invoices/'+editId+'?reason='+encodeURIComponent(reason),{method:'PUT',body:JSON.stringify(payload)});
      closeModal(); toast('Invoice updated.',true); render(); }catch(e){ toast(e.message); }
  } else {
    payload.auto_post=$('#i_post').checked;
    const advApps=collectAdvanceApplications('i_advbox');
    if(advApps.length && !payload.auto_post){ toast('Post the invoice to apply advances (uncheck draft).'); return; }
    try{ const inv=await api('/sales/invoices',{method:'POST',body:JSON.stringify(payload)});
      let msg='Invoice created.';
      if(advApps.length){ const errs=await applyAdvancesTo('customer', inv.id, advApps, payload.date);
        msg = errs.length ? ('Invoice created; some advances not applied: '+errs.join('; ')) : 'Invoice created and advance(s) applied.'; }
      closeModal(); toast(msg,true); render(); }catch(e){ toast(e.message); }
  }
}

function recalcBill(){
  let net=0,vat=0;
  document.querySelectorAll('#b_lines tbody tr').forEach(tr=>{ const q=parseFloat(tr.querySelector('.b_qty').value)||0, p=parseFloat(tr.querySelector('.b_price').value)||0, sel=tr.querySelector('.b_vat'), r=parseFloat(sel.selectedOptions[0].dataset.rate)||0; net+=q*p; vat+=q*p*r; });

async function saveBill(editId){
  const lines=[...document.querySelectorAll('#b_lines tbody tr')].map(tr=>{
    const price=tr.querySelector('.b_price').value; const acc=tr.querySelector('.b_acc').value; if(!price||!acc) return null;
    const sel=tr.querySelector('.b_vat');
    return {description:tr.querySelector('.b_desc').value, quantity:tr.querySelector('.b_qty').value||'1', unit_price:price, vat_rate:sel.selectedOptions[0].dataset.rate, vat_treatment:sel.value, expense_account_id:acc};
  }).filter(Boolean);
  if(!$('#b_ven').value){ toast('Select a vendor.'); return; }
  if(!lines.length){ toast('Add at least one line with an account and price.'); return; }
  const payload={vendor_id:$('#b_ven').value, date:$('#b_date').value, due_date:$('#b_due').value||null,
    vendor_ref:$('#b_ref').value||null, department:$('#b_dept').value||null, project:$('#b_proj').value||null, lines, ...retentionPayload('b')};
  if(editId){
    const reason=($('#b_reason').value||'').trim();
    if(!reason){ toast('A reason for the change is required.'); return; }
    if(!confirm('Save changes? The bill is reversed and re-posted; all ledgers, VAT and reports update immediately.')) return;
    try{ await api('/purchases/bills/'+editId+'?reason='+encodeURIComponent(reason),{method:'PUT',body:JSON.stringify(payload)});
      closeModal(); toast('Bill updated.',true); render(); }catch(e){ toast(e.message); }
  } else {
    payload.auto_post=$('#b_post').checked;
    const advApps=collectAdvanceApplications('b_advbox');
    if(advApps.length && !payload.auto_post){ toast('Post the bill to apply advances (uncheck draft).'); return; }
    try{ const bill=await api('/purchases/bills',{method:'POST',body:JSON.stringify(payload)});
      let msg='Bill created.';
      if(advApps.length){ const errs=await applyAdvancesTo('vendor', bill.id, advApps, payload.date);
        msg = errs.length ? ('Bill created; some advances not applied: '+errs.join('; ')) : 'Bill created and advance(s) applied.'; }
      closeModal(); toast(msg,true); render(); }catch(e){ toast(e.message); }
  }
}

async function docApplyAdvance(side, targetId, partyId, balanceDue){
  const path=(side==='customer'?'/sales/advances?available=true&customer_id=':'/purchases/advances?available=true&vendor_id=')+encodeURIComponent(partyId);
  let advs=[]; try{ advs=await api(path); }catch(e){ toast(e.message); return; }
  advs=advs.filter(a=>Number(a.available)>0);
  if(!advs.length){ toast('No unapplied advances for this '+side+'.'); return; }
  const rows=advs.map(a=>`<tr><td class="mono">${a.number}</td><td>${a.date}</td><td class="num">${money(a.available)}</td>
    <td><input class="da_amt num" data-adv="${a.id}" inputmode="decimal" placeholder="0" style="width:110px"></td></tr>`).join('');
  const reopen=side==='customer'?"openInv":"openBill";
  modal(`<div class="row"><h1 style="margin:0">Apply advance</h1><button class="x" onclick="closeModal()">✕</button></div>
    <p class="sub">Outstanding balance: <b>${money(balanceDue)}</b>. Enter how much of each advance to recover against this ${side==='customer'?'invoice':'bill'}.</p>
    <div class="scroll mt"><table><thead><tr><th>Advance</th><th>Date</th><th class="num">Available</th><th class="num">Apply</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="flex mt" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn-primary" id="da_go">Apply</button></div>`,'max-width:560px');
  $('#da_go').onclick=async()=>{
    const apps=[...document.querySelectorAll('.da_amt')].map(i=>({advance_id:i.dataset.adv, amount:i.value})).filter(a=>Number(a.amount)>0);
    if(!apps.length){ toast('Enter an amount to apply.'); return; }
    const errs=await applyAdvancesTo(side, targetId, apps, today());
    closeModal();
    toast(errs.length?('Some advances not applied: '+errs.join('; ')):'Advance(s) applied.', !errs.length);
    window[reopen](targetId);
  };
}

async function docReport(kind){
  const cfg = kind==='sales'
    ? {title:'Sales by Customer', path:'/reports/sales-by-customer', report:'sales-by-customer', groups:['customer','month','quarter','year','project','category'], open:'openInv'}
    : {title:'Invoice by Vendor', path:'/reports/invoice-by-vendor', report:'invoice-by-vendor', groups:['vendor','month','quarter','year','project','category'], open:'openBill'};
  const gopts=cfg.groups.map(g=>`<option value="${g}">${g[0].toUpperCase()+g.slice(1)}</option>`).join('');
  C.innerHTML=`<div class="row mb"><div><h1>${cfg.title}</h1><p class="sub">Every figure ties to underlying documents — click a row to open it.</p></div>
    <div class="flex"><label><span class="lbl">Group by</span><select id="dr_grp">${gopts}</select></label>
      <label><span class="lbl">From</span><input type="date" id="dr_s" value="${yearStart()}"></label>
      <label><span class="lbl">To</span><input type="date" id="dr_e" value="${today()}"></label>
      <button id="dr_go">Apply</button><span id="dr_exp"></span></div></div>
    <div id="dr" class="empty">Loading…</div>`;
  const load=async()=>{ const g=$('#dr_grp').value, s=$('#dr_s').value, e=$('#dr_e').value;
    const qs=`group_by=${g}${s?'&start='+s:''}${e?'&end='+e:''}`;
    $('#dr_exp').innerHTML=exportBtns(cfg.report, qs);
    try{ const rep=await api(cfg.path+'?'+qs);
      const kpis=[['Documents',rep.total_documents],['Net',money(rep.total_net)],['VAT',money(rep.total_vat)],['Gross',money(rep.total_gross)],['Paid',money(rep.total_paid)],['Outstanding',money(rep.total_outstanding)],['Overdue',money(rep.total_overdue)]];
      const kpiHtml=`<div class="grid kpis mb">${kpis.map(([k,v])=>`<div class="card kpi"><div class="k">${k}</div><div class="v" style="font-size:18px">${v}</div></div>`).join('')}</div>`;
      // Group key per document row, matching the backend's _group_key, so a summary row can
      // reveal exactly its own documents on drill-down.
      const rowKey=(r)=>{ if(g==='month') return (r.date||'').slice(0,7);
        if(g==='quarter'){ const d=r.date||''; const m=parseInt(d.slice(5,7))||1; return d.slice(0,4)+'-Q'+(Math.floor((m-1)/3)+1); }
        if(g==='year') return (r.date||'').slice(0,4);
        if(g==='project') return r.project||'—'; if(g==='category') return r.category||'—';
        return r.party_id; };
      window._drRows=rep.rows;
      const docRow=(r)=>`<tr class="click" onclick="${cfg.open}('${r.doc_id}')"><td style="padding-left:24px">${esc(r.party_name)}</td><td class="mono">${r.number}</td><td>${r.date}</td>
        <td class="num">${money(r.net)}</td><td class="num">${money(r.vat)}</td><td class="num">${money(r.gross)}</td><td class="num">${money(r.paid)}</td><td class="num">${money(r.outstanding)}</td><td><span class="pill p-${r.status}">${r.status}</span></td></tr>`;
      window._drDocRow=docRow;
      const groups=rep.groups.map(gr=>{ const key=gr.key.replace(/'/g,"\\'");
        return `<tr class="click" onclick="drToggle(this,'${key}')"><td><span class="dr-caret" style="display:inline-block;width:14px">▸</span><b>${esc(gr.label)}</b></td><td class="num">${gr.count}</td><td class="num">${money(gr.net)}</td><td class="num">${money(gr.vat)}</td><td class="num">${money(gr.gross)}</td><td class="num">${money(gr.paid)}</td><td class="num">${money(gr.outstanding)}</td></tr>
        <tr class="dr-sub" data-key="${esc(gr.key)}" style="display:none"><td colspan="7" style="padding:0"><table style="width:100%"><thead><tr><th>Party</th><th>Number</th><th>Date</th><th class="num">Net</th><th class="num">VAT</th><th class="num">Gross</th><th class="num">Paid</th><th class="num">Outstanding</th><th>Status</th></tr></thead><tbody>${rep.rows.filter(r=>rowKey(r)===gr.key).map(docRow).join('')||'<tr><td colspan="9" class="muted">No documents.</td></tr>'}</tbody></table></td></tr>`; }).join('');
      $('#dr').outerHTML=`<div id="dr">${kpiHtml}
        ${card(`<div class="card-h">Summary by ${g} <span class="muted" style="font-weight:400;font-size:12px">— click a row to drill into its documents</span></div><div class="scroll"><table><thead><tr><th>${g[0].toUpperCase()+g.slice(1)}</th><th class="num">Count</th><th class="num">Net</th><th class="num">VAT</th><th class="num">Gross</th><th class="num">Paid</th><th class="num">Outstanding</th></tr></thead><tbody>${groups||'<tr><td colspan="7" class="muted">No documents.</td></tr>'}</tbody></table></div>`)}</div>`;
      $('#dr_go').onclick=load;
    }catch(err){ $('#dr').outerHTML=`<div id="dr" class="banner b-err">${esc(err.message)}</div>`; } };
  $('#dr_go').onclick=load; load();
}
function drToggle(rowEl, key){
  const sub=rowEl.parentElement.querySelector(`.dr-sub[data-key="${(key||'').replace(/"/g,'\\"')}"]`);
  if(!sub) return; const open=sub.style.display==='none';
  sub.style.display=open?'':'none';
  const c=rowEl.querySelector('.dr-caret'); if(c) c.textContent=open?'▾':'▸';
}

    const regRows=(rows)=>rows.length?rows.map(a=>`<tr class="click" onclick="openAsset('${a.id}')"><td class="mono">${a.asset_code}</td><td>${esc(a.name)}</td><td class="num">${money(a.net_book_value)}</td><td><span class="pill p-${a.status==='active'?'posted':'void'}">${a.status}</span></td></tr>`).join(''):'<tr><td colspan=4 class="muted">None</td></tr>';
    $('#fad').outerHTML=`<div id="fad">${kpiHtml}
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
        ${card(`<div class="card-h">Net Book Value by Category</div><div class="pad">${bars(d.by_category)}</div>`)}
        ${card(`<div class="card-h">Net Book Value by Location</div><div class="pad">${bars(d.by_location)}</div>`)}
        ${card(`<div class="card-h">Recently Acquired</div><div class="scroll"><table><tbody>${regRows(d.recently_acquired)}</tbody></table></div>`)}
        ${card(`<div class="card-h">Approaching End of Life</div><div class="scroll"><table><tbody>${regRows(d.approaching_end_of_life)}</tbody></table></div>`)}
      </div></div>`;
  }catch(e){ $('#fad').outerHTML=`<div id="fad" class="banner b-err">${esc(e.message)}</div>`; }
};

// ── Reconciliation ────────────────────────────────────────────────────────────
let recAccounts=[], recBankId='';
VIEW.reconcile=async()=>{
  recAccounts=await api('/banking/accounts');
  const opts=recAccounts.map(a=>`<option value="${a.id}">${esc(a.name)} (${a.gl_account_code})</option>`).join('');
  C.innerHTML=`<h1>Bank Reconciliation</h1><p class="sub">Import a statement, match it to the ledger, and reconcile.</p>
    ${recAccounts.length?`<div class="flex mb"><label style="min-width:260px"><span class="lbl">Bank account</span><select id="rc_acc">${opts}</select></label></div>
    <div id="rc"></div>`:`<div class="card empty">Create a bank account first (Banking → Bank Accounts).</div>`}`;
  if(!recAccounts.length) return;
  recBankId=recAccounts[0].id;
  $('#rc_acc').onchange=()=>{ recBankId=$('#rc_acc').value; loadRecon(); };
  loadRecon();
};
async function loadRecon(){
  const importCard=card(`<div class="card-h">Import statement lines</div><div class="pad">
    <p class="muted" style="font-size:12px;margin-top:0">Paste CSV rows: <span class="mono">date,description,amount,reference</span> — amount positive = money in, negative = money out.</p>
    <textarea id="rc_csv" rows="4" style="width:100%;font-family:ui-monospace,monospace;font-size:13px" placeholder="2025-02-01,Customer deposit,5000&#10;2025-02-03,Rent,-1200"></textarea>
    <div class="flex mt"><button class="btn-primary" id="rc_import">Import</button><button id="rc_auto">Auto-match</button></div></div>`);
  const reconCard=card(`<div class="card-h">Reconcile</div><div class="pad flex">
    <label><span class="lbl">Statement date</span><input type="date" id="rc_date" value="${today()}"></label>
    <label><span class="lbl">Statement ending balance</span><input id="rc_bal" class="num" inputmode="decimal"></label>
    <button class="btn-primary" id="rc_go">Check</button></div><div id="rc_summary" class="pad" style="padding-top:0"></div></div>`);
  C.querySelector('#rc').innerHTML = `<div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">${importCard}${reconCard}</div>
    <div id="rc_lines" class="mt"></div><div id="rc_hist" class="mt"></div>`;
  $('#rc_import').onclick=async()=>{
    const lines=$('#rc_csv').value.trim().split('\n').map(r=>r.split(',')).filter(c=>c.length>=3 && c[0].trim())
      .map(c=>({date:c[0].trim(), description:(c[1]||'').trim(), amount:(c[2]||'0').trim(), reference:(c[3]||'').trim()||null}));
    if(!lines.length){ toast('No valid rows to import.'); return; }
    try{ const r=await api('/banking/statement/import',{method:'POST',body:JSON.stringify({bank_account_id:recBankId, lines})});
      $('#rc_csv').value=''; toast(`Imported ${r.added} line(s).`,true); loadReconLines(); }catch(e){ toast(e.message); }
  };
  $('#rc_auto').onclick=async()=>{ try{ const r=await api('/banking/auto-match',{method:'POST',body:JSON.stringify({bank_account_id:recBankId, window_days:5})});
    toast(`Auto-matched ${r.matched} line(s).`,true); loadReconLines(); }catch(e){ toast(e.message); } };
  $('#rc_go').onclick=runRecon;
  loadReconLines(); loadReconHist();
}
async function loadReconLines(){
  try{ const lines=await api('/banking/statement-lines?bank_account_id='+recBankId);
    if(!lines.length){ $('#rc_lines').innerHTML=card(`<div class="empty">No statement lines imported yet.</div>`); return; }
    let st={}; try{ st=await api('/attachments/status-bulk?entity_type=bank_statement_line&ids='+encodeURIComponent(lines.map(l=>l.id).join(','))); }catch(e){}
    const rows=lines.map(l=>{ const s=st[l.id]||{code:'none',count:0}; const em=(ATT_STATUS[s.code]||['⚪'])[0];
      return `<tr><td>${l.date}</td><td>${esc(l.description||'—')}</td><td class="num">${money(l.amount)}</td>
      <td>${l.matched_entry_no?('#'+l.matched_entry_no):'—'}</td><td><span class="pill p-${l.status==='reconciled'?'paid':(l.status==='matched'?'posted':'draft')}">${l.status}</span></td>
      <td><button class="btn" title="Attachments" onclick="openEntityDocs('bank_statement_line','${l.id}','Bank line ${l.date}')">📎 ${em}${s.count?(' '+s.count):''}</button></td>
      <td>${l.status==='unmatched'?`<button class="btn" onclick="pickMatch('${l.id}')">Match</button>`:(l.status==='matched'?`<button class="x" title="unmatch" onclick="doUnmatch('${l.id}')">✕</button>`:'')}</td></tr>`; }).join('');
    $('#rc_lines').innerHTML=card(`<div class="card-h">Statement lines</div><div class="scroll"><table><thead><tr><th>Date</th><th>Description</th><th class="num">Amount</th><th>Entry</th><th>Status</th><th>Docs</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`);
  }catch(e){ $('#rc_lines').innerHTML=`<div class="banner b-err">${esc(e.message)}</div>`; }
}
async function pickMatch(lineId){
  const cands=await api('/banking/statement-lines/'+lineId+'/candidates');
  if(!cands.length){ toast('No matching ledger entries found for this amount.'); return; }
  const rows=cands.map(c=>`<tr class="click" onclick="doMatch('${lineId}','${c.entry_id}')"><td class="mono">#${c.entry_no}</td><td>${c.date}</td><td>${esc(c.memo||'—')}</td><td class="muted">${c.source}</td><td class="num">${money(c.amount)}</td></tr>`).join('');
  modal(`<div class="row"><h1>Match statement line</h1><button class="x" onclick="closeModal()">✕</button></div>
    <p class="muted">Pick the ledger entry that corresponds to this statement line.</p>
    <div class="scroll mt"><table><thead><tr><th>Entry</th><th>Date</th><th>Memo</th><th>Source</th><th class="num">Amount</th></tr></thead><tbody>${rows}</tbody></table></div>`);
}
async function doMatch(lineId, entryId){ try{ await api('/banking/match',{method:'POST',body:JSON.stringify({statement_line_id:lineId, entry_id:entryId})}); closeModal(); toast('Matched.',true); loadReconLines(); }catch(e){ toast(e.message); } }
async function doUnmatch(lineId){ try{ await api('/banking/statement-lines/'+lineId+'/unmatch',{method:'POST'}); toast('Unmatched.',true); loadReconLines(); }catch(e){ toast(e.message); } }
async function runRecon(){
  const bal=$('#rc_bal').value; if(bal===''){ toast('Enter the statement ending balance.'); return; }
  try{ const s=await api('/banking/reconcile/summary',{method:'POST',body:JSON.stringify({bank_account_id:recBankId, statement_date:$('#rc_date').value, statement_balance:bal})});
    const line=(l,v,strong)=>`<div class="row" style="padding:3px 0;${strong?'font-weight:700':''}"><span class="muted">${l}</span><span class="num">${money(v)}</span></div>`;
    const items=(arr,title)=>arr.length?`<div class="muted mt" style="font-size:11px;text-transform:uppercase">${title}</div><table>${arr.map(i=>`<tr><td class="mono">#${i.entry_no}</td><td>${i.date}</td><td>${esc(i.memo||'—')}</td><td class="num">${money(i.amount)}</td></tr>`).join('')}</table>`:'';
    const unbooked=s.unmatched_statement.length?`<div class="banner b-warn mt">${s.unmatched_statement.length} statement line(s) not yet booked in the ledger — book them (e.g. bank charges) then re-check.</div>`:'';
    $('#rc_summary').innerHTML=`
      ${line('Statement balance', s.statement_balance)}
      ${line('Add: deposits in transit', s.deposits_in_transit)}
      ${line('Less: outstanding payments', s.outstanding_payments)}
      ${line('Book balance (ledger)', s.book_balance)}
      <div class="banner ${s.reconciled?'b-ok':'b-err'} mt">${s.reconciled?'✓ Reconciled — difference 0.00':'Difference '+money(s.difference)+(s.reconciled?'':' — not yet reconciled')}</div>
      ${unbooked}${items(s.deposits,'Deposits in transit (in books, not on statement)')}${items(s.payments,'Outstanding payments (in books, not on statement)')}
      <div class="flex mt" style="justify-content:flex-end"><button class="btn-primary" id="rc_complete" ${s.reconciled?'':'disabled'}>Complete reconciliation</button></div>`;
    $('#rc_complete').onclick=async()=>{ try{ await api('/banking/reconcile/complete',{method:'POST',body:JSON.stringify({bank_account_id:recBankId, statement_date:$('#rc_date').value, statement_balance:bal})});
      toast('Reconciliation completed.',true); loadReconLines(); loadReconHist(); $('#rc_summary').innerHTML=''; }catch(e){ toast(e.message); } };
  }catch(e){ $('#rc_summary').innerHTML=`<div class="banner b-err">${esc(e.message)}</div>`; }
}
async function loadReconHist(){
  try{ const h=await api('/banking/reconciliations?bank_account_id='+recBankId);
    if(!h.length){ $('#rc_hist').innerHTML=''; return; }
    const rows=h.map(r=>`<tr><td>${r.statement_date}</td><td class="num">${money(r.statement_balance)}</td><td class="num">${money(r.book_balance)}</td><td class="num">${money(r.difference)}</td><td class="num">${r.cleared_count}</td><td>${new Date(r.created_at).toLocaleDateString()}</td></tr>`).join('');
    $('#rc_hist').innerHTML=card(`<div class="card-h">Reconciliation history</div><div class="scroll"><table><thead><tr><th>Statement date</th><th class="num">Statement bal.</th><th class="num">Book bal.</th><th class="num">Difference</th><th class="num">Cleared</th><th>Completed</th></tr></thead><tbody>${rows}</tbody></table></div>`);
  }catch(e){ $('#rc_hist').innerHTML=''; }
}

// ── Inventory: Stock & Valuation ──────────────────────────────────────────────
let stockProducts=[], stockWarehouses=[];
VIEW.stock=async()=>{
  C.innerHTML=`<div class="row mb"><div><h1>Stock &amp; Valuation</h1><p class="sub">Live inventory valuation, reconciled to the GL Inventory account.</p></div>
    <button class="btn-primary" id="s_move">Record movement</button></div>
    <div id="s_low"></div><div id="s_val" class="empty">Loading…</div><div id="s_mv" class="mt"></div>`;
  [stockProducts, stockWarehouses] = [await api('/inventory/products'), await api('/inventory/warehouses')];
  $('#s_move').onclick=()=>{ if(!stockProducts.filter(p=>p.track_inventory).length||!stockWarehouses.length){ toast('Create a stock product and a warehouse first.'); return; } movementForm(); };
  try{
    const low=await api('/inventory/low-stock');
    if(low.length){ $('#s_low').innerHTML=`<div class="banner b-warn mb"><b>Low stock:</b> ${low.map(r=>esc(r.sku)+' '+esc(r.name)+' ('+Number(r.on_hand)+'/'+Number(r.reorder_level)+')').join(' · ')}</div>`; }
    const v=await api('/inventory/valuation');
    const sync=`<div class="banner ${v.in_sync?'b-ok':'b-err'} mb">${v.in_sync?'✓ Valuation reconciles to GL Inventory ('+money(v.gl_inventory_balance)+')':'✗ Out of sync with GL Inventory ('+money(v.total_value)+' vs '+money(v.gl_inventory_balance)+')'}</div>`;
    if(!v.rows.length){ $('#s_val').outerHTML=`<div id="s_val">${sync}<div class="card empty">No stock on hand.</div></div>`; }
    else{ const rows=v.rows.map(r=>`<tr class="click" onclick="prodMovements('${r.product_id}')"><td class="mono">${r.sku}</td><td>${esc(r.name)}</td><td>${esc(r.category||'—')}</td>
      <td>${r.cost_method==='fifo'?'FIFO':'Avg'}</td><td class="num">${Number(r.on_hand).toLocaleString()}</td><td class="num">${money(r.avg_cost)}</td><td class="num"><b>${money(r.stock_value)}</b></td></tr>`).join('');
      $('#s_val').outerHTML=`<div id="s_val">${sync}${card(`<div class="card-h">Stock valuation</div><div class="scroll"><table><thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Method</th><th class="num">On hand</th><th class="num">Avg cost</th><th class="num">Value</th></tr></thead>
        <tbody>${rows}</tbody><tfoot><tr><th colspan="6" class="right">Total</th><th class="num">${money(v.total_value)}</th></tr></tfoot></table></div>`)}</div>`; }
    prodMovements(null);
  }catch(e){ $('#s_val').outerHTML=`<div id="s_val" class="banner b-err">${esc(e.message)}</div>`; }
};
async function prodMovements(pid){
  try{ const mv=await api('/inventory/movements'+(pid?'?product_id='+pid:''));
    if(!mv.length){ $('#s_mv').innerHTML=''; return; }
    let st={}; try{ st=await api('/attachments/status-bulk?entity_type=stock_movement&ids='+encodeURIComponent(mv.slice(0,100).map(m=>m.id).join(','))); }catch(e){}
    const rows=mv.slice(0,100).map(m=>{ const s=st[m.id]||{code:'none',count:0}; const em=(ATT_STATUS[s.code]||['⚪'])[0];
      return `<tr><td>${m.date}</td><td class="mono">${esc(m.product_name||'')}</td><td>${esc(m.warehouse_name||'')}</td><td>${m.movement_type}</td>
      <td class="num">${Number(m.quantity).toLocaleString()}</td><td class="num">${money(m.unit_cost)}</td><td class="num">${money(m.total_cost)}</td>
      <td>${m.journal_entry_id?`<a class="click" onclick="openJe('${m.journal_entry_id}')" style="cursor:pointer;color:var(--brand)">JE</a>`:''}</td>
      <td><button class="btn" title="Attachments" onclick="openEntityDocs('stock_movement','${m.id}','Stock movement ${m.date}')">📎 ${em}${s.count?(' '+s.count):''}</button></td></tr>`; }).join('');
    $('#s_mv').innerHTML=card(`<div class="card-h">Stock movements${pid?' (filtered)':''}</div><div class="scroll"><table><thead><tr><th>Date</th><th>Product</th><th>Warehouse</th><th>Type</th><th class="num">Qty</th><th class="num">Unit cost</th><th class="num">Total</th><th>GL</th><th>Docs</th></tr></thead><tbody>${rows}</tbody></table></div>`);
  }catch(e){ $('#s_mv').innerHTML=''; }
}
function movementForm(){
  const pOpts=stockProducts.filter(p=>p.track_inventory).map(p=>`<option value="${p.id}">${p.sku} — ${esc(p.name)}</option>`).join('');
  const wOpts=stockWarehouses.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('');
  modal(`<h1>Record stock movement</h1><div class="grid mt" style="grid-template-columns:1fr 1fr;gap:12px">
    <label><span class="lbl">Product</span><select id="m_prod">${pOpts}</select></label>
    <label><span class="lbl">Warehouse</span><select id="m_wh">${wOpts}</select></label>
    <label><span class="lbl">Type</span><select id="m_type"><option value="receipt">Receipt (stock in)</option><option value="issue">Issue (stock out)</option><option value="adjustment">Adjustment</option><option value="opening">Opening balance</option></select></label>
    <label><span class="lbl">Date</span><input type="date" id="m_date" value="${today()}"></label>
    <label><span class="lbl">Quantity</span><input id="m_qty" class="num"></label>
    <label id="m_costwrap"><span class="lbl">Unit cost</span><input id="m_cost" class="num" placeholder="(issues computed)"></label>
    <label id="m_incwrap" style="display:none"><span class="lbl">Adjustment direction</span><select id="m_inc"><option value="true">Increase</option><option value="false">Decrease</option></select></label>
    <label><span class="lbl">Reference</span><input id="m_ref"></label></div>
    <div class="flex mt" style="justify-content:flex-end"><button onclick="closeModal()">Cancel</button><button class="btn-primary" id="m_save">Post movement</button></div>`);
  const upd=()=>{ const t=$('#m_type').value; $('#m_incwrap').style.display = t==='adjustment'?'block':'none';
    $('#m_costwrap').style.display = t==='issue'?'none':'block'; };
  $('#m_type').onchange=upd; upd();
  $('#m_save').onclick=async()=>{ try{ const t=$('#m_type').value;
    await api('/inventory/movements',{method:'POST',body:JSON.stringify({
      product_id:$('#m_prod').value, warehouse_id:$('#m_wh').value, date:$('#m_date').value, movement_type:t,
      quantity:$('#m_qty').value||'0', unit_cost:(t==='issue'?null:($('#m_cost').value||null)),
      increase:$('#m_inc').value==='true', reference:$('#m_ref').value||null })});
    closeModal(); toast('Movement posted.',true); render(); }catch(e){ toast(e.message); } };
}

    <div class="flex mt" style="justify-content:flex-end"><button onclick="closeModal()">Cancel</button><button class="btn-primary" id="e_save">${editing?'Save changes':'Create'}</button></div>`);

    if(!$('#e_name').value.trim()){ toast('Employee name is required.'); return; }

      iban:$('#e_iban').value||null, is_active:editing?$('#e_active').value==='true':true };
    if(editing){
      if(Number(payload.basic_salary)!==Number(e.basic_salary) &&
         !confirm('You are changing the salary structure. Already-posted payslips keep their original figures; future runs use the new salary. Save?')) return;

let runEmployees=[];
VIEW.payrollRuns=async()=>{

function runForm(){

    <td><input class="r_ot num" data-e="${e.id}" inputmode="decimal" placeholder="0" style="width:90px"></td>
    <td><input class="r_ded num" data-e="${e.id}" inputmode="decimal" placeholder="0" style="width:90px"></td></tr>`).join('');
  modal(`<h1>New payroll run</h1>
    <div class="grid mt mb" style="grid-template-columns:1fr 1fr 1fr;gap:10px">
      <label><span class="lbl">Period label</span><input id="r_period" value="${new Date().toISOString().slice(0,7)}"></label>
      <label><span class="lbl">Pay date</span><input type="date" id="r_pay" value="${today()}"></label>

async function openRun(id){
  const r=await api('/payroll/runs/'+id);
  const rows=r.payslips.map(p=>`<tr><td class="mono">${p.employee_code}</td><td>${esc(p.employee_name)}</td><td class="num">${money(p.basic)}</td>
    <td class="num">${money(p.allowances)}</td><td class="num">${money(p.overtime)}</td><td class="num">${money(p.gross)}</td>
    <td class="num">${money(p.deductions)}</td><td class="num"><b>${money(p.net)}</b></td><td class="num">${money(p.eosb_accrual)}</td></tr>`).join('');
  let actions='';
  if(r.status==='draft') actions+=`<button class="btn-primary" id="rv_post">Post</button>`;
  if(r.status==='posted') actions+=`<button class="btn-primary" id="rv_pay">Pay (via bank)</button>`;
  if(r.status==='draft'||r.status==='posted') actions+=`<button class="btn-danger" id="rv_void">Void</button>`;
  modal(`<div class="row"><div><div class="muted">Payroll run</div><h1 style="margin:0">${esc(r.period_label)} <span class="pill p-${r.status==='paid'?'paid':(r.status==='posted'?'posted':(r.status==='void'?'void':'draft'))}">${r.status}</span></h1>
    <div class="muted">Pay date ${r.pay_date}</div></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="scroll mt"><table><thead><tr><th>Code</th><th>Name</th><th class="num">Basic</th><th class="num">Allow.</th><th class="num">OT</th><th class="num">Gross</th><th class="num">Deduct.</th><th class="num">Net</th><th class="num">EOSB</th></tr></thead>
      <tbody>${rows}</tbody><tfoot><tr><th colspan="5" class="right">Totals</th><th class="num">${money(r.gross_total)}</th><th class="num">${money(r.deductions_total)}</th><th class="num">${money(r.net_total)}</th><th class="num">${money(r.eosb_total)}</th></tr></tfoot></table></div>
    <div class="flex mt" style="border-top:1px solid var(--border);padding-top:14px">${actions}
      ${r.journal_entry_id?`<a class="btn" onclick="closeModal();openJe('${r.journal_entry_id}')">View accrual JE</a>`:''}
      ${r.payment_entry_id?`<a class="btn" onclick="closeModal();openJe('${r.payment_entry_id}')">View payment JE</a>`:''}</div>
    <div id="attMount"></div>`, 'max-width:820px');
  mountAttachments('payroll_run', id);

  if($('#rv_pay')) $('#rv_pay').onclick=async()=>{ try{ await api('/payroll/runs/'+id+'/pay',{method:'POST'}); closeModal(); toast('Run paid.',true); render(); }catch(e){ toast(e.message); } };

let _analysis=null;
VIEW.importData=async()=>{
  C.innerHTML=`<h1>Import (Trial Balance / General Ledger / Financial Report)</h1>
    <p class="sub">Upload Excel (.xlsx/.xls), CSV or PDF. The file is read, validated and analysed before anything is posted.</p>
    ${card(`<div class="pad">
      <div class="flex mb">
        <label><span class="lbl">Document type</span><select id="im_kind">
          <option value="tb">Trial Balance</option><option value="gl">General Ledger</option><option value="report">Financial Report (BS / P&amp;L)</option></select></label>
        <label style="flex:1;min-width:220px"><span class="lbl">File</span><input type="file" id="im_file" accept=".xlsx,.xls,.csv,.pdf"></label>
        <button class="btn-primary" id="im_go">Analyze</button>
      </div>
      <div class="flex">
        <label><span class="lbl">Opening / entry date</span><input type="date" id="im_date" value="${today()}"></label>
        <label style="display:flex;align-items:end;gap:6px"><input type="checkbox" id="im_create"> Auto-create missing accounts (by code range)</label>
        <label style="display:flex;align-items:end;gap:6px"><input type="checkbox" id="im_skip" checked> Skip unbalanced GL groups</label>
      </div></div>`)}
    <div id="im_out" class="mt"></div>`;
  $('#im_go').onclick=analyzeImport;
};
async function analyzeImport(){
  const f=$('#im_file').files[0]; if(!f){ toast('Choose a file first.'); return; }
  const kind=$('#im_kind').value;
  const fd=new FormData(); fd.append('kind',kind); fd.append('file',f);
  $('#im_out').innerHTML=`<div class="empty">Analyzing ${esc(f.name)}…</div>`;
  try{
    const res=await fetch('/api/import/analyze',{method:'POST',body:fd});
    if(!res.ok){ const j=await res.json().catch(()=>({})); throw new Error(j.detail||res.statusText); }
    _analysis=await res.json();
    renderAnalysis();
  }catch(e){ $('#im_out').innerHTML=`<div class="banner b-err">${esc(e.message)}</div>`; }
}
function renderAnalysis(){
  const a=_analysis;
  const bal=a.kind==='gl'
    ? `<span class="pill ${a.groups.every(g=>g.balanced)?'p-paid':'p-void'}">${a.groups.length} group(s), ${a.groups.filter(g=>g.balanced).length} balanced</span>`
    : `<span class="banner ${a.balanced?'b-ok':'b-err'}" style="display:inline-block;padding:2px 10px">${a.balanced?'✓ Balanced ('+money(a.total_debit)+')':'✗ Out of balance: Dr '+money(a.total_debit)+' / Cr '+money(a.total_credit)}</span>`;
  const warn=a.warnings.length?`<div class="banner b-warn">${a.warnings.map(esc).join('<br>')}</div>`:'';
  const mapping=`<div class="muted" style="font-size:12px">Columns mapped: ${Object.entries(a.mapping).map(([k,v])=>`${k}=<b>${esc(v)}</b>`).join(', ')||'none detected'}</div>`;
  const counts=`<div class="muted mt" style="font-size:13px">${a.matched_count} matched · ${a.new_count} new · ${a.unmatched_count} needs attention · ${a.rows.length} rows</div>`;
  const rows=a.rows.map(r=>`<tr><td class="mono">${esc(r.code||'—')}</td><td>${esc(r.name||'—')}</td>
    ${a.kind==='gl'?`<td>${r.date||'—'}</td><td>${esc(r.reference||'—')}</td>`:''}
    <td class="num">${moneyBlank(r.debit)}</td><td class="num">${moneyBlank(r.credit)}</td>
    <td><span class="pill ${r.status==='ok'?'p-paid':(r.status==='new'?'p-posted':'p-void')}">${r.status}</span></td>
    <td class="muted" style="font-size:12px">${esc(r.note||'')}</td></tr>`).join('');
  const groups=a.kind==='gl'&&a.groups.length?card(`<div class="card-h">Journal groups</div><div class="scroll"><table><thead><tr><th>Reference</th><th>Date</th><th class="num">Debit</th><th class="num">Credit</th><th>Balanced</th></tr></thead><tbody>${a.groups.map(g=>`<tr><td>${esc(g.reference)}</td><td>${g.date||'—'}</td><td class="num">${money(g.total_debit)}</td><td class="num">${money(g.total_credit)}</td><td>${g.balanced?'<span class="pill p-paid">yes</span>':'<span class="pill p-void">no</span>'}</td></tr>`).join('')}</tbody></table></div>`)+'<div class="mb"></div>':'';
  const types=a.kind==='report'&&a.by_type.length?card(`<div class="card-h">By account type</div><div class="scroll"><table><thead><tr><th>Type</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Net</th></tr></thead><tbody>${a.by_type.map(t=>`<tr><td>${t.type}</td><td class="num">${money(t.debit)}</td><td class="num">${money(t.credit)}</td><td class="num">${money(t.net)}</td></tr>`).join('')}</tbody></table></div>`)+'<div class="mb"></div>':'';
  const canCommit = a.kind==='gl' ? a.groups.some(g=>g.balanced) : a.balanced;
  $('#im_out').innerHTML=`${warn}${mapping}<div class="mt mb">${bal}</div>${types}${groups}
    ${card(`<div class="card-h">Preview (${a.rows.length} rows)</div><div class="scroll" style="max-height:50vh"><table><thead><tr><th>Code</th><th>Account</th>${a.kind==='gl'?'<th>Date</th><th>Ref</th>':''}<th class="num">Debit</th><th class="num">Credit</th><th>Status</th><th>Note</th></tr></thead><tbody>${rows}</tbody></table></div>`)}
    ${counts}
    <div class="flex mt"><button class="btn-primary" id="im_commit" ${canCommit?'':'disabled'}>Import into ledger</button>
      ${canCommit?'':'<span class="muted">Fix the balance / mapping before importing.</span>'}</div>
    <div id="im_result" class="mt"></div>`;
  $('#im_commit').onclick=commitImport;
}
async function commitImport(){
  const a=_analysis;
  const rows=a.rows.map(r=>({row_no:r.row_no, code:r.code, name:r.name, debit:r.debit, credit:r.credit, date:r.date, reference:r.reference, memo:r.memo}));
  try{
    const res=await api('/import/commit',{method:'POST',body:JSON.stringify({
      kind:a.kind, rows, opening_date:$('#im_date').value||null,
      create_missing:$('#im_create').checked, skip_unbalanced:$('#im_skip').checked })});
    const links=res.journal_entry_ids.map(id=>`<a class="click" style="color:var(--brand);cursor:pointer" onclick="openJe('${id}')">JE</a>`).join(' · ');
    const acc=res.accounts_created.length?`<div class="muted">Accounts created: ${res.accounts_created.map(esc).join(', ')}</div>`:'';
    const skip=res.skipped.length?`<div class="banner b-warn mt">Skipped: ${res.skipped.map(esc).join('; ')}</div>`:'';
    $('#im_result').innerHTML=`<div class="banner b-ok">${esc(res.message)}</div>${acc}<div class="mt">${links}</div>${skip}`;
    $('#im_commit').disabled=true;
    toast('Import complete.',true);
  }catch(e){ $('#im_result').innerHTML=`<div class="banner b-err">${esc(e.message)}</div>`; }
}

async function partyStatement(kind){

  const opts=parties.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');

    ${card(`<div class="pad flex"><label style="min-width:220px"><span class="lbl">${isCust?'Customer':'Vendor'}</span><select id="ps_party"><option value="">Select…</option>${opts}</select></label>

    try{ const st=await api(`/reports/${rep}?${qs}`);
      const rows=st.lines.map(l=>`<tr class="${l.link?'click':''}" ${l.link?`onclick="stOpen('${l.link}','${l.doc_id}')"`:''}>
        <td>${l.date}</td><td>${l.type}</td><td class="mono">${esc(l.reference||'—')}</td>
        <td class="num">${moneyBlank(l.debit)}</td><td class="num">${moneyBlank(l.credit)}</td><td class="num"><b>${money(l.balance)}</b></td></tr>`).join('');
      $('#ps').innerHTML=card(`<div class="card-h row"><span><b>${esc(st.party_name)}</b> ${st.party_trn?`<span class="mono muted">${esc(st.party_trn)}</span>`:''}</span>
        <span class="muted">Closing balance <b>${money(st.closing_balance)}</b> ${st.currency}</span></div>
        <div class="scroll"><table><thead><tr><th>Date</th><th>Type</th><th>Reference</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead>
        <tbody><tr class="muted"><td colspan="5">Opening balance</td><td class="num">${money(st.opening_balance)}</td></tr>${rows||''}</tbody>
        <tfoot><tr><th colspan="3" class="right">Totals / Closing</th><th class="num">${money(st.total_debit)}</th><th class="num">${money(st.total_credit)}</th><th class="num">${money(st.closing_balance)}</th></tr></tfoot></table></div>`);
    }catch(err){ $('#ps').innerHTML=`<div class="banner b-err">${esc(err.message)}</div>`; } };
  ['ps_party','ps_s','ps_e'].forEach(id=>$('#'+id).onchange=load);

// ── Document layout templates (invoice/receipt customization) ─────────────────────
const TMPL_BLOCKS=[['customer','Customer details'],['invoice_details','Invoice details'],['line_items','Line items'],['totals','Totals / VAT'],['bank_details','Bank details'],['notes','Notes'],['signature','Signature']];
const TMPL_TOGGLES=[['logo','Company logo'],['company','Company details'],['customer','Customer details'],['invoice_details','Invoice details'],['totals','Totals & VAT'],['bank_details','Bank details'],['notes','Notes'],['signature','Signature line']];
let _tmplOrder=['customer','invoice_details','line_items','totals','bank_details','notes','signature'];
let _tmplPrevTimer=null;
VIEW.docTemplates=async()=>{
  C.innerHTML=`<div class="row mb"><div><h1>Document Templates</h1><p class="sub">Customize invoice &amp; receipt layout, sections, logo placement, bank details and notes. Presentation only — never affects accounting.</p></div>
    <button class="btn-primary" id="tmpl_new">+ New template</button></div><div id="tmpl_list" class="empty">Loading…</div>`;
  $('#tmpl_new').onclick=()=>templateEditor(null);
  try{ const list=await api('/document-templates');
    const rows=list.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${t.doc_type}</td><td>${t.page_size}</td>
      <td>${t.is_default?'<span class="pill p-paid">default</span>':''}</td>
      <td class="right"><button class="btn" onclick='templateEditor(${JSON.stringify(t).replace(/'/g,"&#39;")})'>Edit</button>
        ${!t.is_default?`<button class="btn" onclick="tmplSetDefault('${t.id}')">Make default</button>`:''}
        <button class="btn btn-danger" onclick="tmplDelete('${t.id}')">Delete</button></td></tr>`).join('');
    $('#tmpl_list').outerHTML=`<div id="tmpl_list">${card(`<div class="scroll"><table><thead><tr><th>Name</th><th>Type</th><th>Size</th><th></th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="muted">No templates — the built-in default layout is used until you create one.</td></tr>'}</tbody></table></div>`)}</div>`;
  }catch(e){ $('#tmpl_list').outerHTML=`<div id="tmpl_list" class="banner b-err">${esc(e.message)}</div>`; }
};
function tmplSetDefault(id){ api('/document-templates/'+id+'/default',{method:'POST'}).then(()=>{toast('Default set.',true);VIEW.docTemplates();}).catch(e=>toast(e.message)); }
function tmplDelete(id){ if(!confirm('Delete this template?'))return; api('/document-templates/'+id,{method:'DELETE'}).then(()=>{toast('Deleted.',true);VIEW.docTemplates();}).catch(e=>toast(e.message)); }
function templateEditor(t){
  t=t||{sections:{},order:_tmplOrder.slice()};
  _tmplOrder=(t.order&&t.order.length?t.order.slice():['customer','invoice_details','line_items','totals','bank_details','notes','signature']);
  const sec=Object.assign({logo:true,company:true,customer:true,invoice_details:true,line_items:true,totals:true,bank_details:true,notes:true,signature:false}, t.sections||{});
  const toggles=TMPL_TOGGLES.map(([k,l])=>`<label style="display:block;font-size:13px"><input type="checkbox" class="tmpl_sec" data-k="${k}" ${sec[k]?'checked':''}> ${l}</label>`).join('');
  modal(`<div class="row"><h1 style="margin:0">${t.id?'Edit':'New'} template</h1><button class="x" onclick="closeModal()">✕</button></div>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-top:8px">
      <div>
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:8px">
          <label style="grid-column:1/3"><span class="lbl">Template name</span><input id="tm_name" value="${esc(t.name||'')}"></label>
          <label><span class="lbl">Document type</span><select id="tm_type"><option value="invoice"${t.doc_type!=='receipt'?' selected':''}>Invoice</option><option value="receipt"${t.doc_type==='receipt'?' selected':''}>Receipt</option></select></label>
          <label><span class="lbl">Page size</span><select id="tm_size">${['A4','A5','Letter'].map(s=>`<option${(t.page_size||'A4')===s?' selected':''}>${s}</option>`).join('')}</select></label>
          <label><span class="lbl">Logo position</span><select id="tm_logopos">${['left','center','right'].map(s=>`<option${(t.logo_position||'left')===s?' selected':''}>${s}</option>`).join('')}</select></label>
          <label><span class="lbl">Accent color</span><input type="color" id="tm_accent" value="${t.accent_color||'#2563eb'}"></label>
          <label><span class="lbl">Font size</span><input type="number" id="tm_font" min="7" max="12" value="${t.font_size||9}"></label>
          <label style="grid-column:1/3"><input type="checkbox" id="tm_default" ${t.is_default?'checked':''}> Set as default for this document type</label>
        </div>
        <div class="mt"><b style="font-size:13px">Sections</b><div class="grid" style="grid-template-columns:1fr 1fr;gap:2px;margin-top:4px">${toggles}</div></div>
        <div class="mt"><b style="font-size:13px">Order</b><div id="tm_order" class="mt"></div></div>
        <label class="mt" style="display:block"><span class="lbl">Bank / payment details</span><textarea id="tm_bank" rows="3">${esc(t.bank_details||'')}</textarea></label>
        <label class="mt" style="display:block"><span class="lbl">Footer / customer notes</span><textarea id="tm_notes" rows="2">${esc(t.footer_notes||'')}</textarea></label>
        <div class="flex mt" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn-primary" id="tm_save">${t.id?'Save':'Create'}</button></div>
      </div>
      <div><b style="font-size:13px">Live preview</b><iframe id="tmpl_preview" style="width:100%;height:64vh;border:1px solid var(--border);border-radius:8px;margin-top:4px;background:#fff"></iframe></div>
    </div>`,'max-width:1000px');
  const renderOrder=()=>{ $('#tm_order').innerHTML=_tmplOrder.map((k,i)=>{ const lbl=(TMPL_BLOCKS.find(b=>b[0]===k)||[k,k])[1];
    return `<div class="row" style="padding:2px 0;font-size:13px"><span>${lbl}</span><span>
      <button class="btn" ${i===0?'disabled':''} onclick="tmplMove(${i},-1)">↑</button>
      <button class="btn" ${i===_tmplOrder.length-1?'disabled':''} onclick="tmplMove(${i},1)">↓</button></span></div>`; }).join(''); };
  renderOrder();
  const doPrev=()=>{ clearTimeout(_tmplPrevTimer); _tmplPrevTimer=setTimeout(tmplPreview, 350); };
  modalRoot().addEventListener('input', doPrev);
  modalRoot().addEventListener('change', doPrev);
  window._tmplRenderOrder=renderOrder; window._tmplDoPrev=doPrev;
  $('#tm_save').onclick=()=>tmplSave(t.id);
  tmplPreview();
}
function modalRoot(){ return document.getElementById('overlay'); }
function tmplMove(i,d){ const j=i+d; if(j<0||j>=_tmplOrder.length)return; const a=_tmplOrder; [a[i],a[j]]=[a[j],a[i]]; window._tmplRenderOrder(); window._tmplDoPrev(); }
function tmplCollect(){
  const sections={}; document.querySelectorAll('.tmpl_sec').forEach(c=>sections[c.dataset.k]=c.checked);
  return { name:($('#tm_name').value||'Template'), doc_type:$('#tm_type').value, page_size:$('#tm_size').value,
    logo_position:$('#tm_logopos').value, accent_color:$('#tm_accent').value, font_size:Number($('#tm_font').value||9),
    sections, order:_tmplOrder.slice(), bank_details:$('#tm_bank').value||null, footer_notes:$('#tm_notes').value||null,
    is_default:$('#tm_default').checked };
}
async function tmplPreview(){
  try{ const t=tok(); const res=await fetch('/api/document-templates/preview',{method:'POST',headers:{'Content-Type':'application/json',...(t?{'Authorization':'Bearer '+t}:{})},body:JSON.stringify(tmplCollect())});
    if(!res.ok) return; const blob=await res.blob(); const f=$('#tmpl_preview'); if(f) f.src=URL.createObjectURL(blob);
  }catch(e){}
}
async function tmplSave(id){
  try{ const body=tmplCollect();
    if(id) await api('/document-templates/'+id,{method:'PUT',body:JSON.stringify(body)});
    else await api('/document-templates',{method:'POST',body:JSON.stringify(body)});
